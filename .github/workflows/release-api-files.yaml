# Builds api-references.zip (all api.* spec files) and commits it to
# .gitbook/assets/ on main. GitBook Git Sync uploads it as a space file, so the
# download is served behind the doc portal's visitor authentication instead of
# a public GitHub Release (the repository is private).
#
# The download buttons in quickstart/api-intro.md and
# quickstart/list-of-api-services.md link to the file with a relative path.

name: Publish API References ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Only spec changes rebuild the zip. The zip commit itself does not match
    # these paths, so it does not trigger this workflow again.
    paths:
      - '**/api.yml'
      - '**/api.yaml'
      - '**/api.json'
      - '.github/workflows/release-api-files.yaml'

concurrency:
  group: publish-api-references-zip
  cancel-in-progress: false

jobs:
  zip-and-commit:
    runs-on: ubuntu-latest

    env:
      ZIP_PATH: .gitbook/assets/api-references.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          # tech-cicd can bypass the pull-request rule on main.
          token: ${{ secrets.API_REFERENCES_TOKEN }}

      - name: Build zip of api.* files
        run: |
          set -euo pipefail
          # The zip has no folders: each spec is named after its service folder
          # without a "-service" suffix, e.g.
          #   orders/availability/api-reference/api.yml   -> availability-api.yml
          #   products-labels-and-brands/brand-service/... -> brand-api.yml
          # These names are listed in quickstart/list-of-api-services.md.
          # Hidden folders (.git, .gitbook, .style-guide templates) are skipped.
          STAGE=$(mktemp -d)
          find . -type f -name 'api.*' -not -path './.*' | while IFS= read -r file; do
            service=$(basename "$(dirname "$(dirname "$file")")")
            service=${service%-service}
            target="$STAGE/$service-api.${file##*.}"
            if [ -e "$target" ]; then
              echo "Two specs would be named $(basename "$target") in the zip ($file)" >&2
              exit 1
            fi
            cp "$file" "$target"
          done
          echo "Files: $(ls "$STAGE" | wc -l)"
          # Fixed timestamps and sorted entries keep the zip byte-identical when
          # the specs have not changed, so no empty update commits are made.
          touch -t 198001010000 "$STAGE"/*
          rm -f "$ZIP_PATH"
          (cd "$STAGE" && ls | LC_ALL=C sort | zip -X -D -q "$GITHUB_WORKSPACE/$ZIP_PATH" -@)
          ls -lh "$ZIP_PATH"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "tech-cicd"
          git config user.email "cicd-user@emporix.com"
          git add "$ZIP_PATH"
          if git diff --staged --quiet; then
            echo "api-references.zip is up to date"
            exit 0
          fi
          git commit -m "chore: update api-references.zip [skip ci]"
          # Another workflow may have pushed to main meanwhile; rebase and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing on main"
            git pull --rebase origin main
          done
          echo "Could not push api-references.zip" >&2
          exit 1
