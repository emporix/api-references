              schema:
                $ref: '#/components/schemas/ErrorRecordPage'
              examples:
                Errors response:
                  $ref: '#/components/examples/ErrorRecordPage_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/runs/{runId}/diagnostics':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_runId'
    get:
      summary: Retrieving run diagnostics
      description: |-
        Retrieves the source rows represented by a run's feed-quality counters.

        A run reports how many source rows repeated a natural key (`duplicateKeys`) and how many child
        lines had no parent to attach to (`unresolvedParents`). This endpoint identifies the affected rows
        and returns each record's key, its parent-linking field and value, and the number of lines waiting
        for each missing parent.

        Neither counter is a failure, so these rows are kept separately from run errors.

        The rows are a capped SAMPLE, not necessarily the whole set — `recorded` gives how many were
        stored and `sampleTruncated` says whether a stream hit the cap. The run's own counters show the
        total number of affected rows; do not use the returned row count to measure the size of the problem.

      operationId: GET-importtool-list-run-diagnostics
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/trait_diagnosticsStreamId'
        - $ref: '#/components/parameters/trait_diagnosticsKind'
        - name: limit
          in: query
          required: false
          description: Maximum number of rows to return. Defaults differ between the JSON and CSV operations.
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 50000
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The diagnostic rows are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPage'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/runs/{runId}/diagnostics/csv':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_runId'
    get:
      summary: Downloading run diagnostics as CSV
      description: |-
        Returns the same rows as a CSV attachment, for opening in a spreadsheet or attaching to a ticket.

        Comment lines above the header indicate whether the `limit` parameter restricted the response or
        a stream reached the recording cap. These comments preserve that context when the file is shared
        independently of the request.

        Values are quoted. Any value beginning with `=`, `+`, `-`, or `@` is prefixed with an apostrophe
        so that spreadsheet software does not interpret source-provided data as a formula.

      operationId: GET-importtool-download-run-diagnostics-csv
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/trait_diagnosticsStreamId'
        - $ref: '#/components/parameters/trait_diagnosticsKind'
        - name: limit
          in: query
          required: false
          description: Maximum number of rows to include. Defaults differ between the JSON and CSV operations.
          schema:
            type: integer
            default: 50000
            minimum: 1
            maximum: 50000
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The CSV file is returned.
          headers:
            Content-Disposition:
              description: Attachment disposition and the suggested file name.
              schema:
                type: string
                example: attachment; filename="diagnostics-tenant-2026-09-23.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |-
                # capped sample: 2000 rows recorded (cap 2000 per stream) - the run's counters show the total number of affected rows
                stream,kind,key,linkingField,linkingValue,targetType,waitingLines,occurrence
                poLine,UNRESOLVED_PARENT,ID:PO-4711,HEADER_ID,PO-4711,PURCHASE_ORDER,7,
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/data/types':
