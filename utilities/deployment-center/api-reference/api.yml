  '/deployment-center/{tenant}/available-packages/{availablePackageId}/versions/{version}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_availablePackageId'
      - $ref: '#/components/parameters/path_version'
    put:
      summary: Uploading a version of an available package
      operationId: PUT-deploymentcenter-upsert-available-package-version
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Receives the archive of one version as `multipart/form-data` with a `metadata` part (JSON) and an `archive` part (binary). The upload is idempotent by SHA-256: the same hash is a no-op, and a different hash for an existing version is rejected with `409 VERSION_IMMUTABLE`.

        The upload is rejected with `400` when the manifest version inside the archive differs from the version in the path, when the archive references an earlier version that is not uploaded yet, or when `archiveSha256` does not match the `archive` part. An `Idempotency-Key` header is accepted and is informational only: the SHA-256 comparison decides whether a repeated upload is a no-op.

        An `archive` part larger than the receiving limit is rejected with `413`. The limit is 50 MB by default and is set per environment.

        #### Archives in parts

        A large version archive is split into parts, each a zip in the same layout, and uploaded one part per call with `part` and `parts` in the metadata. The parts above 1 are uploaded first; they are stored, but the version is not listed yet. Part 1 is uploaded last and lists the SHA-256 of every part in `partSha256s`. It is accepted only when every other part is stored with the listed hash; the archive is then validated as a whole and the version becomes available. Until then, uploading a part again replaces it. An archive of one part is uploaded without `part`, `parts` and `partSha256s`.
      tags:
        - Available Package
      security:
        - OAuth2:
            - deploymentcenter.package_manage
      parameters:
        - $ref: '#/components/parameters/header_Idempotency-Key_informational'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvailablePackageVersionUpload'
            examples:
              Request example:
                value:
                  metadata:
                    versionId: '6563d4c3c3d4e5f607182933'
                    notes: Adds the loyalty schema
                    releasedAt: '2026-11-12T15:00:00Z'
                    archiveSha256: '7d3e9a41c05b6f28e1a97b0c4d53f6e82a19c7b0d4e5f3a6182b9c0d71e4a5f3'
                  archive: '(binary content of the version 2 archive, application/zip)'
            encoding:
              metadata:
                contentType: application/json
              archive:
                contentType: application/zip
      responses:
        '200':
          description: The version already exists with the same hash; it is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailablePackageVersion'
              examples:
                Available package version:
                  value:
                    version: 2
                    versionId: '6563d4c3c3d4e5f607182933'
                    notes: Adds the loyalty schema
                    releasedAt: '2026-11-12T15:00:00Z'
                    archiveSha256: '7d3e9a41c05b6f28e1a97b0c4d53f6e82a19c7b0d4e5f3a6182b9c0d71e4a5f3'
        '201':
          description: The request was successful. The version was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailablePackageVersion'
              examples:
                Available package version:
                  value:
                    version: 2
                    versionId: '6563d4c3c3d4e5f607182933'
                    notes: Adds the loyalty schema
                    releasedAt: '2026-11-12T15:00:00Z'
                    archiveSha256: '7d3e9a41c05b6f28e1a97b0c4d53f6e82a19c7b0d4e5f3a6182b9c0d71e4a5f3'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '409':
          description: 'The request conflicts with the current state. The `errorCode` field tells which rule was hit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              examples:
                VERSION_IMMUTABLE:
                  value:
                    code: 409
                    status: Conflict
                    message: Version 2 already exists with a different archive hash.
                    errorCode: VERSION_IMMUTABLE
        '413':
          $ref: '#/components/responses/413_resp_archive_too_large'
        '500':
          $ref: '#/components/responses/500_resp_common'
