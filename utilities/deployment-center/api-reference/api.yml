          items:
            $ref: '#/components/schemas/Area'
        scope:
          description: Items to ship. Absent ships every item of the chosen areas.
          type: array
          items:
            $ref: '#/components/schemas/ItemRef'
        workflowIds:
          description: Ids of the workflows the package is linked to.
          type: array
          items:
            type: string
        instanceTypeIds:
          description: Ids of the instance types whose instances the package ships.
          type: array
          items:
            type: string
    Package:
      description: 'A package: a set of items of a source tenant that is built into versions.'
      allOf:
        - $ref: '#/components/schemas/PackageWrite'
        - type: object
          required:
            - id
            - sourceTenant
            - latestVersion
          properties:
            id:
              description: Unique identifier of the package, generated when the package is created.
              type: string
            sourceTenant:
              description: Tenant the package is read from.
              type: string
            latestVersion:
              description: 'Number of the latest packaged version; 0 when there is none.'
              type: integer
            latestVersionId:
              description: 'Id of the latest packaged version. It is `null` when there is none.'
              type: string
              nullable: true
            createdAt:
              description: Date and time when the object was created.
              type: string
              format: date-time
            modifiedAt:
              description: Date and time when the object was last modified.
              type: string
              format: date-time
      example:
        id: '6563c3b2c3d4e5f607182932'
        name: Loyalty configuration
        description: Schemas and agents of the loyalty program.
        source:
          kind: self
        areas:
          - schemas
          - agents
        workflowIds:
          - '6563b2a1c3d4e5f607182931'
        sourceTenant: acmedev
        latestVersion: 2
        latestVersionId: '6563d4c3c3d4e5f607182933'
        createdAt: '2026-11-02T08:00:00Z'
        modifiedAt: '2026-11-12T14:30:00Z'
    PlanRow:
      description: One source item compared with the latest packaged version.
      type: object
      required:
        - area
        - itemId
        - name
        - status
      properties:
        area:
          $ref: '#/components/schemas/Area'
          description: Content area of the item.
        itemId:
          description: Id of the item inside its area.
