    VersionStatus:
      description: 'Lifecycle status of a version. Today `draft` (being built) or `packaged`. More values (validated, approved, published, deprecated, archived) can be added later without a breaking change, so clients must tolerate unknown values.'
      type: string
      x-extensible-enum:
        - draft
        - packaged
    AreaSummary:
      description: Change counts of one area in a version.
      type: object
      properties:
        added:
          description: Number of items added.
          type: integer
        changed:
          description: Number of items changed.
          type: integer
        removed:
          description: Number of items removed.
          type: integer
        unchanged:
          description: Number of items unchanged.
          type: integer
    PackageVersion:
      description: A version of a package, built from the source tenant.
      type: object
      required:
        - id
        - packageId
        - version
        - status
      properties:
        id:
          description: Unique identifier of the version, generated when the build starts.
          type: string
        packageId:
          description: Id of the package the version belongs to.
          type: string
        version:
          description: Version number, starting at 1. The server assigns it.
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
          description: Lifecycle status of the version.
        previousVersionId:
          description: 'Id of the previous version. It is `null` for the first version.'
          type: string
          nullable: true
        notes:
          description: Release notes of the version.
          type: string
        summary:
          description: Change counts per area.
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/AreaSummary'
        buildJobId:
          description: Id of the build-version job that produced the version.
          type: string
        deployedStepIds:
          description: Ids of the workflow steps the version has reached.
          type: array
          items:
            type: string
        deletable:
          description: Only the latest packaged version that has not reached any target can be deleted.
          type: boolean
        createdAt:
          description: Date and time when the build started.
          type: string
          format: date-time
        packagedAt:
          description: 'Date and time when the version was marked `packaged`. It is `null` while the version is a draft.'
          type: string
          format: date-time
          nullable: true
      example:
        id: '6563d4c3c3d4e5f607182933'
        packageId: '6563c3b2c3d4e5f607182932'
        version: 2
        status: packaged
        previousVersionId: '6563d4b1c3d4e5f607182931'
        notes: Adds the loyalty schema
        summary:
          schemas:
            added: 1
            changed: 2
            removed: 0
            unchanged: 5
          agents:
            added: 0
            changed: 1
            removed: 0
            unchanged: 1
        deployedStepIds:
          - stage
        deletable: false
        createdAt: '2026-11-12T14:00:00Z'
        packagedAt: '2026-11-12T14:02:10Z'
    VersionItem:
      description: One item stored in a version.
      type: object
      required:
        - area
        - itemId
        - name
      properties:
        area:
          $ref: '#/components/schemas/Area'
          description: Content area of the item.
        itemId:
          description: Id of the item inside its area.
          type: string
        name:
          description: Display name of the item.
          type: string
        contentVersion:
          description: Version whose archive holds this item's content.
          type: integer
        content:
          description: Item content as stored in the version. The server masks known secret fields in the returned content.
          type: object
          additionalProperties: true
          x-masked: true
      example:
        area: schemas
        itemId: product-extra
        name: Product extra
        contentVersion: 3
        content:
          id: product-extra
          name:
            en: Product extra
    DeployRequest:
      description: Request for a preview or a push.
      type: object
      required:
        - targetStepId
      properties:
        targetStepId:
          description: Workflow step to apply the version on.
          type: string
        deleteRemoved:
          description: Delete items on the target that were removed from the package.
          type: boolean
          default: false
        itemIds:
          description: 'Restrict the run to these items, each in the form `{area}/{itemId}`, for example `schemas/product-extra`. Absent applies every item of the version.'
          type: array
          items:
            type: string
            pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
        acknowledgedItemIds:
          description: 'Ids of items with target drift or a breaking change that the operator has confirmed, each in the form `{area}/{itemId}`, for example `schemas/product-extra`.'
          type: array
          items:
            type: string
            pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
      additionalProperties: false
      example:
        targetStepId: prod
        deleteRemoved: false
        acknowledgedItemIds:
          - schemas/product-extra
    ReleaseRequest:
      description: Request to release a version to a workflow step.
      type: object
      required:
        - targetStepId
      properties:
        targetStepId:
          description: Workflow step whose environment receives the version.
          type: string
      example:
        targetStepId: stage
    RollbackRequest:
      description: Request to roll back an installation.
      type: object
      properties:
        itemIds:
          description: 'Restrict the rollback to these items, each in the form `{area}/{itemId}`, for example `schemas/product-extra`. Absent rolls back every item of the installation. A rollback, partial or full, uses up the run''s backup: the items that were not selected cannot be rolled back afterwards; push again to change them.'
          type: array
          items:
            type: string
            pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
    LocalInstallRequest:
      description: 'Request for a preview or a local install of an available package version. It has no `targetStepId`: the target is the tenant in the path.'
      type: object
      properties:
        deleteRemoved:
          description: Delete items on this tenant that were removed from the package.
          type: boolean
          default: false
        itemIds:
          description: 'Restrict the run to these items, each in the form `{area}/{itemId}`, for example `schemas/product-extra`. Absent applies every item of the version.'
          type: array
          items:
            type: string
            pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
        acknowledgedItemIds:
          description: 'Ids of items with drift or a breaking change that the operator has confirmed, each in the form `{area}/{itemId}`, for example `schemas/product-extra`.'
          type: array
          items:
            type: string
            pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
      additionalProperties: false
    AreaOutcome:
      description: Number of items of one area that succeeded and failed.
      type: object
      required:
        - area
        - ok
        - failed
      properties:
        area:
          $ref: '#/components/schemas/Area'
          description: Content area of the item.
        ok:
          description: Number of items of the area that succeeded.
          type: integer
        failed:
          description: Number of items of the area that failed.
          type: integer
    Installation:
      description: The current state of one (package, target) pairing. It is written by the service only.
      type: object
      required:
        - id
        - packageId
        - direction
        - versionId
        - version
        - status
        - lastJobId
        - canRollback
      properties:
        id:
          description: 'Opaque, server-derived identifier of an installation (one per package and target step, or per available package on the receiving tenant). Stable across runs; do not parse it.'
          type: string
        packageId:
          description: "Id of the installed package. For a local installation it is the id of the available package, which equals the sender's package id."
          type: string
        packageName:
          description: Name of the installed package.
          type: string
        direction:
          description: 'How the version arrived: `push`, `release` or `local`.'
          type: string
          enum:
            - push
            - release
            - local
        targetStepId:
          description: 'Id of the target workflow step. It is `null` for a local installation.'
          type: string
          nullable: true
        availablePackageId:
          description: 'Id of the available package. It is `null` unless the installation is local.'
          type: string
          nullable: true
        versionId:
          description: Id of the version the last successful run installed, or, while no run has succeeded yet, the version of the latest run. For a release installation, it is the released version, which the receiving tenant has not necessarily installed.
          type: string
        version:
          description: Number of the version in `versionId`.
          type: integer
        status:
          description: 'State of the last run: `running`, `done` or `error`.'
          type: string
          enum:
            - running
            - done
            - error
        finishedAt:
          description: 'Date and time when the last run finished. It is `null` while the run is in progress.'
          type: string
          format: date-time
          nullable: true
        deleteRemoved:
          description: Whether the last run deleted items that were removed from the package.
          type: boolean
        areas:
          description: Outcome of the last run per area.
          type: array
          items:
            $ref: '#/components/schemas/AreaOutcome'
        lastJobId:
          description: Id of the job of the last run.
          type: string
        activeJobId:
          description: 'Id of the queued or running job that blocks a new job on this installation. It is `null` when there is none.'
          type: string
          nullable: true
        canRollback:
          description: 'The latest run succeeded and can be rolled back. It is `false` when the latest run failed or was cancelled, while a queued or running job blocks a new job on this installation, and always for a release installation.'
          type: boolean
      example:
        id: 'czo2NTYzYzNiMmMzZDRlNWY2MDcxODI5MzI6cHJvZA'
        packageId: '6563c3b2c3d4e5f607182932'
        packageName: Loyalty configuration
        direction: push
        targetStepId: prod
        availablePackageId: null
        versionId: '6563d4b1c3d4e5f607182931'
        version: 1
        status: running
        finishedAt: null
        deleteRemoved: false
        areas: []
        lastJobId: '6563e5d0c3d4e5f607182936'
        activeJobId: '6563e5d0c3d4e5f607182936'
        canRollback: false
    InstallLog:
      description: The record of a finished push, release, rollback or local install job. Its id is the id of that job.
      type: object
      required:
        - id
        - jobType
        - packageId
        - versionId
        - version
        - status
      properties:
        id:
          description: Equals the id of the job.
          type: string
        jobType:
          description: Type of the job that produced the log.
          type: string
          enum:
            - push
            - release
            - local-install
            - rollback
        packageId:
          description: 'Id of the package. The package may have been deleted since. For a local install or a rollback of a local installation it is the id of the available package, which equals the sender''s package id.'
          type: string
        packageName:
          description: Name of the package at the time of the run.
          type: string
        versionId:
          description: 'Id of the version that was installed. For a local install or a rollback of a local installation it is the version id on the sending tenant.'
          type: string
        version:
          description: Number of the version that was installed.
          type: integer
        direction:
          description: 'How the version arrived: `push`, `release` or `local`.'
          type: string
          enum:
            - push
            - release
            - local
        targetStepId:
          description: 'Id of the target workflow step. It is `null` for a local install and for a rollback of a local installation.'
          type: string
          nullable: true
        status:
          description: How the job ended.
          type: string
          enum:
            - succeeded
            - failed
            - cancelled
        startedAt:
          description: Date and time when the job started.
          type: string
          format: date-time
        finishedAt:
          description: Date and time when the job finished.
          type: string
          format: date-time
        deleteRemoved:
          description: Whether the run deleted items that were removed from the package.
          type: boolean
        areas:
          description: Outcome of the run per area.
          type: array
          items:
            $ref: '#/components/schemas/AreaOutcome'
        rollbackOfJobId:
          description: 'Id of the job this rollback reversed. It is `null` for other job types.'
          type: string
          nullable: true
      example:
        id: '6563e5d0c3d4e5f607182937'
        jobType: push
        packageId: '6563c3b2c3d4e5f607182932'
        packageName: Loyalty configuration
        versionId: '6563d4c3c3d4e5f607182933'
        version: 2
        direction: push
        targetStepId: prod
        status: failed
        startedAt: '2026-11-12T15:04:41Z'
        finishedAt: '2026-11-12T15:05:00Z'
        deleteRemoved: false
        areas:
          - area: schemas
            ok: 4
            failed: 1
        rollbackOfJobId: null
    PromotionBlock:
      description: "The parent step that blocks promotion and the version it has. A step is blocked while its parent's installed or released version is lower than the version being promoted, unless the parent is the package source; in a coverage read that is the package's latest version."
      type: object
      required:
        - parentStepId
        - parentVersion
      properties:
        parentStepId:
          description: Id of the parent step whose version is lower than the version being promoted.
          type: string
        parentVersion:
          description: Version the parent step has installed or released, or `0` when it has none.
          type: integer
    StepCoverage:
      description: The state of one workflow step for a package.
      type: object
      required:
        - stepId
        - workflowId
        - state
      properties:
        stepId:
          description: Id of the workflow step.
          type: string
        workflowId:
          description: Id of the workflow the step belongs to.
          type: string
        state:
          description: 'State of the step for the package''s latest version: `current` (the latest version is installed), `released` (the latest version is released to the step but not installed; a released version that the receiving tenant installs locally is not visible here and stays `released`), `behind` (an older version is installed or released), `missing` (no version yet), `source` (the step is the package source) or `none` (the package has no packaged version yet).'
          type: string
          enum:
            - current
            - released
            - behind
            - missing
            - source
            - none
        installedVersion:
          description: 'Number of the installed version. Coverage reflects what this tenant delivered: a version pushed here counts as installed, while a released version that the receiving tenant installs locally is not visible here. It is `null` when none is installed.'
          type: integer
          nullable: true
        releasedVersion:
          description: 'Number of the released version. It is `null` when none is released.'
          type: integer
          nullable: true
        promotionBlock:
          description: 'Set when the parent step blocks a push or release to this step, `null` otherwise.'
          oneOf:
            - $ref: '#/components/schemas/PromotionBlock'
            - $ref: '#/components/schemas/NullValue'
    Coverage:
      description: Which version each workflow step has and where promotion is blocked.
      type: object
      required:
        - packageId
        - rollup
        - steps
      properties:
        packageId:
          description: Id of the package.
          type: string
        rollup:
          description: 'Overall state of the package across its workflows: `unlinked` (no workflow is linked), `noVersion` (no packaged version yet), `noTargets` (the linked workflows have no target steps), `current` (every target step has the latest version) or `pending` (at least one target step does not). A step with the latest version installed or released counts as having it.'
          type: string
          enum:
            - unlinked
            - noVersion
            - noTargets
            - current
            - pending
        steps:
          description: State of every workflow step of the linked workflows.
          type: array
          items:
            $ref: '#/components/schemas/StepCoverage'
      example:
        packageId: '6563c3b2c3d4e5f607182932'
        rollup: pending
        steps:
          - stepId: dev
            workflowId: '6563b2a1c3d4e5f607182931'
            state: source
            installedVersion: null
            releasedVersion: null
            promotionBlock: null
          - stepId: stage
            workflowId: '6563b2a1c3d4e5f607182931'
            state: released
            installedVersion: null
            releasedVersion: 2
            promotionBlock: null
          - stepId: prod
            workflowId: '6563b2a1c3d4e5f607182931'
            state: behind
            installedVersion: 1
            releasedVersion: null
            promotionBlock: null
          - stepId: prod-eu
            workflowId: '6563b2a1c3d4e5f607182931'
            state: behind
            installedVersion: 1
            releasedVersion: null
            promotionBlock:
              parentStepId: prod
              parentVersion: 1
    PendingPackage:
      description: A package with workflow steps that have not received its latest version.
      type: object
      properties:
        packageId:
          description: Id of the package.
          type: string
        packageName:
          description: Name of the package.
          type: string
        latestVersion:
          description: Number of the latest packaged version.
          type: integer
        pendingStepIds:
          description: Ids of the workflow steps that do not have the latest version. A step that has the latest version installed or released is not pending.
          type: array
          items:
            type: string
    WaitingUpgrade:
      description: An available package whose installed version is behind the latest one.
      type: object
      properties:
        availablePackageId:
          description: Id of the available package.
          type: string
        name:
          description: Name of the available package.
          type: string
        installedVersion:
          description: 'Number of the installed version. It is `null` when none is installed.'
          type: integer
          nullable: true
        latestVersion:
          description: Number of the latest available version.
          type: integer
    OpenFailure:
      description: A failed run that no later successful run has superseded.
      type: object
      properties:
        logId:
          description: Id of the install log of the failed run.
          type: string
        packageId:
          description: Id of the package.
          type: string
        packageName:
          description: Name of the package.
          type: string
        version:
          description: Number of the version that failed.
          type: integer
        targetStepId:
          description: 'Id of the target workflow step. It is `null` for a local install.'
          type: string
          nullable: true
        jobType:
          description: Type of the job that failed.
          type: string
        finishedAt:
          description: Date and time when the run failed.
          type: string
          format: date-time
    Dashboard:
      description: 'What needs the operator''s attention: pending packages, waiting upgrades and open failures.'
      type: object
      required:
        - pendingPackages
        - waitingUpgrades
        - openFailures
      properties:
        pendingPackages:
          description: Packages with workflow steps that have not received the latest version.
          type: array
          items:
            $ref: '#/components/schemas/PendingPackage'
        waitingUpgrades:
          description: Available packages that wait for an upgrade.
          type: array
          items:
            $ref: '#/components/schemas/WaitingUpgrade'
        openFailures:
          description: Failed runs that no later successful run has superseded.
          type: array
          items:
            $ref: '#/components/schemas/OpenFailure'
      example:
        pendingPackages:
          - packageId: '6563c3b2c3d4e5f607182932'
            packageName: Loyalty configuration
            latestVersion: 2
            pendingStepIds:
              - prod
              - prod-eu
        waitingUpgrades:
          - availablePackageId: '6563c3b2c3d4e5f607182950'
            name: Checkout configuration
            installedVersion: 1
            latestVersion: 2
        openFailures:
          - logId: '6563e5d0c3d4e5f607182937'
            packageId: '6563c3b2c3d4e5f607182932'
            packageName: Loyalty configuration
            version: 2
            targetStepId: prod
            jobType: push
            finishedAt: '2026-11-12T15:05:00Z'
    AvailablePackageWrite:
      description: Request body to create or update an available package on the receiving tenant.
      type: object
      required:
        - sourcePackageId
        - sourceTenant
        - name
      properties:
        sourcePackageId:
          description: Id of the package on the sending tenant.
          type: string
        sourceTenant:
          description: Sending tenant.
          type: string
        name:
          description: Name of the package.
          type: string
        description:
          description: Description of the package.
          type: string
    AvailablePackageVersion:
      description: A version of an available package.
      type: object
      required:
        - version
        - versionId
        - releasedAt
        - archiveSha256
      properties:
        version:
          description: Version number, starting at 1.
          type: integer
        versionId:
          description: Id of the version on the sending tenant.
          type: string
        notes:
          description: Release notes of the version.
          type: string
        releasedAt:
          description: Date and time when the version was released.
          type: string
          format: date-time
        archiveSha256:
          description: SHA-256 of the version archive.
          type: string
      example:
        version: 2
        versionId: '6563d4c3c3d4e5f607182933'
        notes: Adds the loyalty schema
        releasedAt: '2026-11-12T15:00:00Z'
        archiveSha256: '7d3e9a41c05b6f28e1a97b0c4d53f6e82a19c7b0d4e5f3a6182b9c0d71e4a5f3'
    AvailablePackage:
      description: A package released to this tenant, with its versions.
      allOf:
        - $ref: '#/components/schemas/AvailablePackageWrite'
        - type: object
          required:
            - id
            - latestVersion
            - versions
          properties:
            id:
              description: Unique identifier of the available package on this tenant.
              type: string
            latestVersion:
              description: Number of the latest available version.
              type: integer
            installedVersion:
              description: 'Number of the installed version. It is `null` when none is installed.'
              type: integer
              nullable: true
            versions:
              description: Versions released to this tenant.
              type: array
              items:
                $ref: '#/components/schemas/AvailablePackageVersion'
      example:
        id: '6563c3b2c3d4e5f607182932'
        sourcePackageId: '6563c3b2c3d4e5f607182932'
        sourceTenant: acmedev
        name: Loyalty configuration
        description: Schemas and agents of the loyalty program.
        latestVersion: 2
        installedVersion: 1
        versions:
          - version: 1
            versionId: '6563d4b1c3d4e5f607182931'
            notes: First version of the loyalty configuration
            releasedAt: '2026-11-12T14:58:30Z'
            archiveSha256: '4b8f1c27a9e30d65f1b2c84a7e90d3156f2a8b4c9d07e1a3562f8c0b9d41e7a6'
          - version: 2
            versionId: '6563d4c3c3d4e5f607182933'
            notes: Adds the loyalty schema
            releasedAt: '2026-11-12T15:00:00Z'
            archiveSha256: '7d3e9a41c05b6f28e1a97b0c4d53f6e82a19c7b0d4e5f3a6182b9c0d71e4a5f3'
    AvailablePackageVersionMetadata:
      description: Metadata of an uploaded version.
      type: object
      required:
        - versionId
        - releasedAt
        - archiveSha256
      properties:
        versionId:
          description: Id of the version on the sending tenant.
          type: string
        notes:
          description: Release notes of the version.
          type: string
        releasedAt:
          description: Date and time when the version was released.
          type: string
          format: date-time
        archiveSha256:
          description: 'SHA-256 of the archive part. A repeated upload with the same hash is a no-op; a different hash is rejected with `VERSION_IMMUTABLE`.'
          type: string
        part:
          description: 'Number of the part this call uploads, starting at 1. Omit it for an archive of one part.'
          type: integer
          minimum: 1
          default: 1
        parts:
          description: 'Number of parts of the archive. Omit it for an archive of one part.'
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        partSha256s:
          description: 'SHA-256 of every part of the archive, in part order. Required on part 1 when `parts` is greater than 1; its first entry is `archiveSha256`.'
          type: array
          items:
            type: string
    AvailablePackageVersionUpload:
      description: Multipart body to upload one version of an available package.
      type: object
      required:
        - metadata
        - archive
      properties:
        metadata:
          $ref: '#/components/schemas/AvailablePackageVersionMetadata'
          description: Metadata of the version, as JSON.
        archive:
          description: 'The version archive (delta zip), or the part of it that `part` names.'
          type: string
          format: binary
    JobType:
      description: Type of a job.
      type: string
      enum:
        - build-version
        - preview
        - push
        - release
        - rollback
        - local-install
    JobStatus:
      description: 'Status of a job: `queued`, `running`, `succeeded`, `failed` or `cancelled`.'
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
    JobPhase:
      description: Progress of one phase of a job.
      type: object
      required:
        - name
        - status
      properties:
        name:
          description: 'Name of the phase. A push, release, local install or rollback uses `backup` (the rollback copy of the target), `definitions` (types and mixins), `records` (instances, indexes, agents, value streams), `archives` (code of cloud functions and hostings uploaded and their builds started; lists each of them in `items`), `awaiting-builds` (builds that ended), `vsm` (value streams, written once the code they call is live), `deletes` and `skipped` (unchanged items). Clients must tolerate new names.'
          type: string
        status:
          description: 'State of the phase. A job that knows its phases up front lists them all from the start, the ones it has not reached as `pending`; a phase it returns to is one entry that runs again.'
          type: string
          enum:
            - pending
            - running
            - done
            - failed
        done:
          description: Number of items of the phase that are done.
          type: integer
        total:
          description: Number of items of the phase.
          type: integer
        items:
          description: 'The slow items of the phase, each with its own state. Only the `archives` phase of an install has them: one per cloud function or hosting.'
          type: array
          items:
            $ref: '#/components/schemas/JobPhaseItem'
    JobPhaseItem:
      description: 'A cloud function or hosting of an install, from the upload of its code until it is live on the target.'
      type: object
      required:
        - id
        - name
        - area
        - status
      properties:
        id:
          description: 'Job item id of the item, as in the job items (`cloud-functions/{id}`, `hostings/{name}`).'
          type: string
        name:
          description: Display name of the item.
          type: string
        area:
          description: Area of the item.
          type: string
          enum:
            - cloud-functions
            - hostings
        status:
          description: '`waiting`: not uploaded yet. `uploading`: its code is being uploaded. `building`: the target builds it. `live`: the build ended and it runs. `failed`: the upload or the build failed; `message` says why.'
          type: string
          enum:
            - waiting
            - uploading
            - building
            - live
            - failed
        step:
          description: 'The build step it runs, as the build log names it, for example `deploy-to-firebase`.'
          type: string
        stepsDone:
          description: 'Build steps finished. With `stepsTotal`, 0 until the build log names its steps.'
          type: integer
        stepsTotal:
          description: Build steps in all.
          type: integer
        startedAt:
          description: When its upload started.
          type: string
          format: date-time
        endedAt:
          description: When it became live or failed.
          type: string
          format: date-time
        expectedSeconds:
          description: 'How long such an item usually takes from upload to live, in seconds. A hint, not a promise.'
          type: integer
        message:
          description: Why it failed.
          type: string
    JobProgress:
      description: Overall progress of a job and the progress of each phase.
      type: object
      required:
        - done
        - total
      properties:
        phase:
          description: 'Current phase, for example `definitions`, `records`, `archives`, `awaiting-builds`, `deletes`.'
          type: string
          nullable: true
        done:
          description: Number of items that are done.
          type: integer
        total:
          description: Number of items in the job.
          type: integer
        phases:
          description: Progress of each phase, in the order the job runs them.
          type: array
          items:
            $ref: '#/components/schemas/JobPhase'
        current:
          $ref: '#/components/schemas/JobActivity'
    JobActivity:
      description: 'What a running job is doing right now. Present while the job runs and the step is known; absent when the job has ended.'
      type: object
      required:
        - step
        - items
        - since
      properties:
        step:
          description: '`backup`: saving the rollback copy of the target. `writing`: writing the items named. `uploading`: uploading the code of the cloud functions and hostings named and starting their builds. `building`: waiting for the builds named. `finishing`: recording the unchanged items. Clients must tolerate new values.'
          type: string
        items:
          description: Items the step works on.
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                description: Display name of the item.
                type: string
              detail:
                description: 'What is known about the item''s own progress. For a build, the step it is at, for example `2/4 · build`.'
                type: string
        since:
          description: 'Date and time when the step started. For `building`, when the first of the builds still running started.'
          type: string
          format: date-time
        expectedSeconds:
          description: 'How long the step usually takes, in seconds, as a hint for slow steps (builds). It is not a promise.'
          type: integer
    JobCounts:
      description: 'Number of items by action and outcome, counted so far. The counts are final when the job ends.'
      type: object
      properties:
        create:
          description: Number of items created.
          type: integer
        update:
          description: Number of items updated.
          type: integer
        skip:
          description: Number of items skipped.
          type: integer
        delete:
          description: Number of items deleted.
          type: integer
        ok:
          description: Number of items that succeeded.
          type: integer
        failed:
          description: Number of items that failed.
          type: integer
    JobBase:
      description: Fields every job has.
      type: object
      required:
        - id
        - type
        - status
        - progress
      properties:
        id:
          description: Unique identifier of the job, generated when the job starts.
          type: string
        type:
          $ref: '#/components/schemas/JobType'
          description: Type of the job.
        status:
          $ref: '#/components/schemas/JobStatus'
          description: Status of the job.
        packageId:
          description: 'Id of the package the job works on. It is `null` for jobs on the receiving side (a local preview, a local install or a rollback of a local installation), which work on an available package.'
          type: string
          nullable: true
        versionId:
          description: 'Id of the version the job works on. For jobs on the receiving side it is the `versionId` of the available version, which is the id of the version on the sending tenant. It is `null` only for a build, whose new version is in the result.'
          type: string
          nullable: true
        targetStepId:
          description: 'Id of the target workflow step of a preview, push, release or rollback. It is `null` for a build and for jobs on the receiving side, including a rollback of a local installation.'
          type: string
          nullable: true
        availablePackageId:
          description: 'Id of the available package. It is set only for jobs on the receiving side (a local preview, a local install or a rollback of a local installation).'
          type: string
          nullable: true
        installationId:
          description: 'Id of the installation the job writes. It is `null` until the installation exists.'
          type: string
          nullable: true
        progress:
          $ref: '#/components/schemas/JobProgress'
          description: Progress of the job.
        counts:
          $ref: '#/components/schemas/JobCounts'
          description: Number of items by action and outcome.
        cancelRequestedAt:
          description: 'Date and time when cancellation was requested. It is `null` when it was not.'
          type: string
          format: date-time
          nullable: true
        error:
          description: 'Set when the job failed. `errorCode` says why, for example `JOB_ABANDONED` when the job stopped making progress.'
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - $ref: '#/components/schemas/NullValue'
        createdAt:
          description: Date and time when the job was created.
          type: string
          format: date-time
        startedAt:
          description: 'Date and time when the job started running. It is `null` while the job is queued.'
          type: string
          format: date-time
          nullable: true
        finishedAt:
          description: 'Date and time when the job finished. It is `null` until then.'
          type: string
          format: date-time
          nullable: true
    BuildVersionResult:
      description: Result of a build-version job.
      type: object
      required:
        - versionId
        - version
      properties:
        versionId:
          description: Id of the new version.
          type: string
        version:
          description: Number of the new version.
          type: integer
    PreviewResult:
      description: Result of a preview job.
      type: object
      properties:
        itemCount:
          description: Number of items compared.
          type: integer
        itemsRequiringAcknowledgement:
          description: Number of items that must be acknowledged before a push or install.
          type: integer
    InstallResult:
      description: Outcome of a push or a local install.
      type: object
      properties:
        installationId:
          description: Id of the installation the job wrote.
          type: string
        version:
          description: Number of the installed version.
          type: integer
        areas:
          description: Outcome per area.
          type: array
          items:
            $ref: '#/components/schemas/AreaOutcome'
    ReleaseResult:
      description: Result of a release job.
      type: object
      properties:
        uploadedVersions:
          description: Numbers of the versions that were uploaded.
          type: array
          items:
            type: integer
        skippedVersions:
          description: Numbers of the versions the target already had.
          type: array
          items:
            type: integer
    RollbackResult:
      description: Result of a rollback job.
      type: object
      properties:
        installationId:
          description: Id of the installation that was rolled back.
          type: string
        areas:
          description: Outcome per area.
          type: array
          items:
            $ref: '#/components/schemas/AreaOutcome'
    BuildVersionJob:
      description: Builds the next version of a package. The result carries the new version.
      allOf:
        - $ref: '#/components/schemas/JobBase'
        - type: object
          properties:
            type:
              description: 'Always `build-version`.'
              type: string
              enum:
                - build-version
            request:
              $ref: '#/components/schemas/BuildVersionRequest'
              description: The request that started the job.
            result:
              description: 'Result of the job. It is `null` until the job succeeds.'
              oneOf:
                - $ref: '#/components/schemas/BuildVersionResult'
                - $ref: '#/components/schemas/NullValue'
    PreviewJob:
      description: Dry run of a push or a local install. Nothing is written. Per-item results are in the job items.
      allOf:
        - $ref: '#/components/schemas/JobBase'
        - type: object
          properties:
            type:
              description: 'Always `preview`.'
              type: string
              enum:
                - preview
            request:
              description: The request that started the job.
              oneOf:
                - $ref: '#/components/schemas/DeployRequest'
                - $ref: '#/components/schemas/LocalInstallRequest'
            result:
              description: 'Result of the job. It is `null` until the job succeeds.'
              oneOf:
                - $ref: '#/components/schemas/PreviewResult'
                - $ref: '#/components/schemas/NullValue'
    PushJob:
      description: Applies a version directly on a target workflow step.
      allOf:
        - $ref: '#/components/schemas/JobBase'
        - type: object
          properties:
            type:
              description: 'Always `push`.'
              type: string
              enum:
                - push
            request:
              $ref: '#/components/schemas/DeployRequest'
              description: The request that started the job.
            result:
              description: 'Result of the job. It is `null` until the job succeeds.'
              oneOf:
                - $ref: '#/components/schemas/InstallResult'
                - $ref: '#/components/schemas/NullValue'
    ReleaseJob:
      description: Publishes a version, and any missing earlier versions, to the target environment.
      allOf:
        - $ref: '#/components/schemas/JobBase'
        - type: object
          properties:
            type:
              description: 'Always `release`.'
              type: string
              enum:
                - release
            request:
              $ref: '#/components/schemas/ReleaseRequest'
              description: The request that started the job.
            result:
              description: 'Result of the job. It is `null` until the job succeeds.'
              oneOf:
                - $ref: '#/components/schemas/ReleaseResult'
                - $ref: '#/components/schemas/NullValue'
    RollbackJob:
      description: Reverses the last run of an installation.
      allOf:
        - $ref: '#/components/schemas/JobBase'
        - type: object
          properties:
            type:
              description: 'Always `rollback`.'
              type: string
              enum:
                - rollback
            request:
              $ref: '#/components/schemas/RollbackRequest'
              description: The request that started the job.
            result:
              description: 'Result of the job. It is `null` until the job succeeds.'
              oneOf:
                - $ref: '#/components/schemas/RollbackResult'
                - $ref: '#/components/schemas/NullValue'
    LocalInstallJob:
      description: Installs an available package version on the receiving tenant.
      allOf:
        - $ref: '#/components/schemas/JobBase'
        - type: object
          properties:
            type:
              description: 'Always `local-install`.'
              type: string
              enum:
                - local-install
            request:
              $ref: '#/components/schemas/LocalInstallRequest'
              description: The request that started the job.
            result:
              description: 'Result of the job. It is `null` until the job succeeds.'
              oneOf:
                - $ref: '#/components/schemas/InstallResult'
                - $ref: '#/components/schemas/NullValue'
    Job:
      description: 'A long-running server job. The `type` field selects the variant with its own `request` and `result`. The fields in `JobBase` are common to all.'
      oneOf:
        - $ref: '#/components/schemas/BuildVersionJob'
        - $ref: '#/components/schemas/PreviewJob'
        - $ref: '#/components/schemas/PushJob'
        - $ref: '#/components/schemas/ReleaseJob'
        - $ref: '#/components/schemas/RollbackJob'
        - $ref: '#/components/schemas/LocalInstallJob'
      discriminator:
        propertyName: type
        mapping:
          build-version: '#/components/schemas/BuildVersionJob'
          preview: '#/components/schemas/PreviewJob'
          push: '#/components/schemas/PushJob'
          release: '#/components/schemas/ReleaseJob'
          rollback: '#/components/schemas/RollbackJob'
          local-install: '#/components/schemas/LocalInstallJob'
      example:
        id: '6563e5d0c3d4e5f607182936'
        type: push
        status: running
        packageId: '6563c3b2c3d4e5f607182932'
        versionId: '6563d4c3c3d4e5f607182933'
        targetStepId: prod
        availablePackageId: null
        installationId: 'czo2NTYzYzNiMmMzZDRlNWY2MDcxODI5MzI6cHJvZA'
        progress:
          phase: definitions
          done: 6
          total: 10
          phases:
            - name: definitions
              status: running
              done: 6
              total: 10
        counts:
          create: 1
          update: 3
          skip: 2
          delete: 0
          ok: 6
          failed: 0
        cancelRequestedAt: null
        error: null
        createdAt: '2026-11-12T15:28:00Z'
        startedAt: '2026-11-12T15:28:01Z'
        finishedAt: null
        request:
          targetStepId: prod
          deleteRemoved: false
          acknowledgedItemIds:
            - schemas/product-extra
        result: null
    PlanItem:
      description: 'Item of a build-version job: a source item and whether it went into the version.'
      allOf:
        - $ref: '#/components/schemas/PlanRow'
        - type: object
          required:
            - kind
            - id
          properties:
            kind:
              description: 'Variant selector. Always `plan`.'
              type: string
              enum:
                - plan
            id:
              description: 'Id of the item, in the form `{area}/{itemId}`, for example `schemas/product-extra`.'
              type: string
              pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
      example:
        kind: plan
        id: schemas/product-extra
        area: schemas
        itemId: product-extra
        name: Product extra
        status: changed
        packaged: true
        hash: 'c91e5a07d3f84b26a0e7d15c9b38f4a2e6d70183b5c9a4f1e82d63b07a15c4e9'
        exportError: null
    DependencyRef:
      description: A dependency of an item, such as an agent, a tool or an MCP server, and what happens to it.
      type: object
      required:
        - kind
        - id
        - action
      properties:
        kind:
          description: Kind of the dependency.
          type: string
          enum:
            - agent
            - tool
            - mcpServer
            - oauth
        id:
          description: Id of the dependency.
          type: string
        action:
          description: What happens to the dependency on the target.
          type: string
          enum:
            - create
            - exists
            - skip
    BreakingChange:
      description: Changes in an item that can break existing data.
      type: object
      properties:
        removed:
          description: Names of the fields that were removed.
          type: array
          items:
            type: string
        retyped:
          description: Fields whose type changed.
          type: array
          items:
            type: object
            properties:
              field:
                description: Name of the field.
                type: string
              from:
                description: Previous type of the field.
                type: string
              to:
                description: New type of the field.
                type: string
    PreviewItem:
      description: Item of a preview job.
      type: object
      required:
        - kind
        - id
        - area
        - itemId
        - action
        - requiresAcknowledgement
      properties:
        kind:
          description: 'Variant selector. Always `preview`.'
          type: string
          enum:
            - preview
        id:
          description: 'Id of the item, in the form `{area}/{itemId}`, for example `schemas/product-extra`.'
          type: string
          pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
        area:
          $ref: '#/components/schemas/Area'
          description: Content area of the item.
        itemId:
          description: Id of the item inside its area.
          type: string
        name:
          description: Display name of the item.
          type: string
        action:
          description: What a push or install does with the item.
          type: string
          enum:
            - create
            - update
            - skip
            - delete
        typeId:
          description: 'Id of the instance type. It is `null` for items that are not instances.'
          type: string
          nullable: true
        before:
          description: Item content on the target before the change. The server masks known secret fields in the returned content.
          type: object
          nullable: true
          additionalProperties: true
          x-masked: true
        drift:
          description: The target item changed since the last install.
          type: object
          nullable: true
          properties:
            modifiedAt:
              description: Date and time when the item changed on the target.
              type: string
              format: date-time
        breaking:
          description: 'Breaking changes of the item, `null` when there are none.'
          oneOf:
            - $ref: '#/components/schemas/BreakingChange'
            - $ref: '#/components/schemas/NullValue'
        dependencies:
          description: Dependencies of the item.
          type: array
          items:
            $ref: '#/components/schemas/DependencyRef'
        requiresAcknowledgement:
          description: 'The item must be listed in `acknowledgedItemIds` to be pushed or installed.'
          type: boolean
      example:
        kind: preview
        id: schemas/product-extra
        area: schemas
        itemId: product-extra
        name: Product extra
        action: update
        typeId: null
        before:
          id: product-extra
          name:
            en: Product extra
        drift:
          modifiedAt: '2026-11-12T15:03:10Z'
        breaking: null
        dependencies: []
        requiresAcknowledgement: true
    RollbackPreviewItem:
      description: One item of a rollback preview.
      type: object
      required:
        - id
        - area
        - name
        - action
      properties:
        id:
          description: 'Id of the item, in the form `{area}/{itemId}`, for example `schemas/product-extra`.'
          type: string
          pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
        area:
          $ref: '#/components/schemas/Area'
        name:
          description: Display name of the item.
          type: string
        action:
          description: 'What a rollback would do on the target: `create` recreates an item the run deleted, `update` restores the previous content, `delete` removes an item the run created, `skip` leaves an item that already matches the backup.'
          type: string
          enum:
            - create
            - update
            - delete
            - skip
        current:
          description: Current content of the item on the target. The server masks known secret fields. It is `null` when the item does not exist on the target.
          type: object
          additionalProperties: true
          nullable: true
          x-masked: true
        restored:
          description: Content the item would have after the rollback, taken from the backup. The server masks known secret fields. It is `null` when the rollback deletes the item. For value streams the encoded export `data` is omitted.
          type: object
          additionalProperties: true
          nullable: true
          x-masked: true
      example:
        id: schemas/product-extra
        area: schemas
        name: Product extra
        action: update
        current:
          id: product-extra
          name:
            en: Product extra
          attributes:
            - key: loyaltyPoints
              type: INTEGER
        restored:
          id: product-extra
          name:
            en: Product extra
          attributes: []
    AppliedItem:
      description: Item of a push, local-install or rollback job.
      type: object
      required:
        - kind
        - id
        - area
        - itemId
        - action
        - ok
      properties:
        kind:
          description: 'Variant selector. Always `applied`.'
          type: string
          enum:
            - applied
        id:
          description: 'Id of the item, in the form `{area}/{itemId}`, for example `schemas/product-extra`.'
          type: string
          pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
        area:
          $ref: '#/components/schemas/Area'
          description: Content area of the item.
        itemId:
          description: Id of the item inside its area.
          type: string
        name:
          description: Display name of the item.
          type: string
        action:
          description: What the job did with the item.
          type: string
          enum:
            - create
            - update
            - skip
            - delete
        ok:
          description: Whether the item was applied successfully.
          type: boolean
        message:
          description: 'Why the item failed. It is `null` when it succeeded.'
          type: string
          nullable: true
        missingScope:
          description: Scope the target client lacks when the item failed for that reason.
          type: string
          nullable: true
        buildStatus:
          description: Status of the function or hosting build, awaited by the job.
          type: string
          nullable: true
      example:
        kind: applied
        id: schemas/product-extra
        area: schemas
        itemId: product-extra
        name: Product extra
        action: update
        ok: true
        message: null
        missingScope: null
        buildStatus: null
    ReleaseItem:
      description: 'Item of a release job: one version uploaded or skipped.'
      type: object
      required:
        - kind
        - version
        - action
        - ok
      properties:
        kind:
          description: 'Variant selector. Always `release`.'
          type: string
          enum:
            - release
        version:
          description: Version number.
          type: integer
        versionId:
          description: Id of the version.
          type: string
        action:
          description: Whether the version was uploaded or skipped because the target had it.
          type: string
          enum:
            - upload
            - skip
        ok:
          description: Whether the upload succeeded.
          type: boolean
        message:
          description: 'Why the upload failed. It is `null` when it succeeded.'
          type: string
          nullable: true
      example:
        kind: release
        version: 2
        versionId: '6563d4c3c3d4e5f607182933'
        action: upload
        ok: true
        message: null
    JobItem:
      description: 'Per-item result of a job. The `kind` field selects the variant.'
      oneOf:
        - $ref: '#/components/schemas/PlanItem'
        - $ref: '#/components/schemas/PreviewItem'
        - $ref: '#/components/schemas/AppliedItem'
        - $ref: '#/components/schemas/ReleaseItem'
      discriminator:
        propertyName: kind
        mapping:
          plan: '#/components/schemas/PlanItem'
          preview: '#/components/schemas/PreviewItem'
          applied: '#/components/schemas/AppliedItem'
          release: '#/components/schemas/ReleaseItem'
  parameters:
    path_tenant:
      name: tenant
      in: path
      required: true
      schema:
        pattern: '^[a-z][a-z0-9]+$'
        minLength: 3
        maxLength: 16
        type: string
      description: |
        Your Emporix tenant's name.
        **Note**: The tenant should always be written in lowercase.
    query_pageNumber:
      name: pageNumber
      in: query
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      description: |
        Page number to be retrieved. The number of the first page is 1.
        **Note:** If the `pageNumber` parameter is passed, size of the pages must be specified in the `pageSize` parameter.
    query_pageSize:
      name: pageSize
      in: query
      required: false
      schema:
        default: 16
        minimum: 1
        type: integer
      description: |
        Number of items to be retrieved per page.
    query_sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: |-
        List of properties used to sort the results, separated by commas. The order of properties indicates their priority in sorting.
        Possible values:
        * `{fieldName}`
        * `{fieldName}.asc`
        * `{fieldName}.desc`
        **Note:** If you want to sort the results by localized properties, the possible values are:
          * `{fieldName}.{language}`
          * `{fieldName}.{language}.asc`
          * `{fieldName}.{language}.desc`
        If the sorting direction is not specified, the fields are sorted in ascending order.
    query_fields:
      name: fields
      in: query
      required: false
      schema:
        type: string
      description: 'Comma-separated fields to be returned in the response, for example `id,status,progress` for a light poll.'
    header_X-Total-Count:
      name: X-Total-Count
      in: header
      required: false
      schema:
        default: false
        type: boolean
      description: Flag indicating whether the total count of retrieved items should be returned.
    header_Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: 'Optional client-chosen key that makes a job start safe to retry. The key is unique per tenant for 24 hours. The same key with the same body returns the original job with `Idempotent-Replayed: true`. The same key with a different body is rejected with `409 IDEMPOTENCY_KEY_REUSED`. Without a key, a retry starts a new job or is rejected with `409 ACTIVE_JOB_EXISTS` naming the job to follow.'
    header_Idempotency-Key_informational:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: 'Accepted for symmetry with the job-starting operations and informational only. A repeated upload is decided by the SHA-256 of the archive, never by this key.'
    path_tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the tenant in the catalog, generated when the tenant is registered.
    path_workflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
      description: 'Workflow''s unique identifier, generated when the workflow is created.'
    path_stepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
      description: 'Workflow step''s identifier, unique within its workflow.'
    path_packageId:
      name: packageId
      in: path
      required: true
      schema:
        type: string
      description: 'Package''s unique identifier, generated when the package is created.'
    path_versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
      description: 'Version''s unique identifier, generated when the build starts.'
    path_area:
      name: area
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Area'
      description: The content area of the item.
    path_typeId:
      name: typeId
      in: path
      required: true
      schema:
        type: string
      description: 'Type id of an instance or index item, the first part of its `{typeId}/{id}` item id.'
    path_itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
      description: Id of the item inside its area.
    path_installationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
      description: 'Opaque, server-derived identifier of an installation (one per package and target step, or per available package on the receiving tenant). Stable across runs; do not parse it.'
    path_logId:
      name: logId
      in: path
      required: true
      schema:
        type: string
      description: Id of the install log. It equals the id of the job that produced it.
    path_jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
      description: Id of the job.
    path_availablePackageId:
      name: availablePackageId
      in: path
      required: true
      schema:
        type: string
      description: 'Available package''s identifier on the receiving tenant.'
    path_version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Version number of the package, starting at 1.
  responses:
    400_resp_common:
      description: The request was syntactically incorrect or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Validation problem:
              value:
                code: 400
                status: Bad Request
                message: Validation problem with the request. The details list each invalid field or parameter.
    401_resp_common:
      description: The authorization token is invalid or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessageFault'
          examples:
            Invalid access token:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
            Access token expired:
              value:
                fault:
                  faultstring: Access Token expired
                  detail:
                    errorcode: keymanagement.service.access_token_expired
    403_resp_common:
      description: Authorization scopes of the access token are not sufficient and do not match the scopes required by the endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Access forbidden:
              value:
                code: 403
                status: Forbidden
                message: The access to the requested resource has been forbidden by the server.
    404_resp_common:
      description: The requested resource has not been found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Resource not found:
              value:
                code: 404
                status: Not Found
                message: The resource with id 628cd20c6e8b2432b6346ca6 has not been found.
    409_resp_self_tenant:
      description: 'The request conflicts with the current state. The `errorCode` field tells which rule was hit.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
          examples:
            SELF_TENANT_UNAVAILABLE:
              value:
                code: 409
                status: Conflict
                message: The operator tenant is not registered and could not be created from the developer portal.
                errorCode: SELF_TENANT_UNAVAILABLE
    409_resp_version_items:
      description: 'The request conflicts with the current state. The `errorCode` field tells which rule was hit.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
          examples:
            VERSION_NOT_PACKAGED:
              value:
                code: 409
                status: Conflict
                message: The version is still being built.
                errorCode: VERSION_NOT_PACKAGED
            SELF_TENANT_UNAVAILABLE:
              value:
                code: 409
                status: Conflict
                message: The operator tenant is not registered and could not be created from the developer portal.
                errorCode: SELF_TENANT_UNAVAILABLE
    413_resp_archive_too_large:
      description: The archive is larger than the receiving limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Archive too large:
              value:
                code: 413
                status: Payload Too Large
                message: The archive is larger than this service accepts (52428800 bytes).
    503_resp_common:
      description: 'The service cannot accept the job right now (queue full, shutting down, or the target did not answer in time). No job was created; retry later.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Job queue full:
              value:
                code: 503
                status: Service Unavailable
                message: The job queue is full. Retry the request later.
    502_resp_common:
      description: An upstream Emporix API call failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Upstream failure:
              value:
                code: 502
                status: Bad Gateway
                message: A call to an upstream Emporix API failed.
    500_resp_common:
      description: A server-side error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Internal Server Error:
              value:
                code: 500
                status: Internal Server Error
                message: Problem encountered while trying to connect to the database.
