  '/deployment-center/{tenant}/installations/{installationId}/rollback-preview':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_installationId'
    get:
      summary: Previewing the rollback of an installation
      operationId: GET-deploymentcenter-preview-installation-rollback
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Shows what a rollback of the installation would change, without writing anything. The answer is synchronous and is not a job. For every item of the last successful run, it compares the backup taken before that run (`restored`) with the current state of the target (`current`), and gives the `action` a rollback would take: `create` for an item the run deleted, `update` for an item the run changed, `delete` for an item the run created, and `skip` for an item that already matches the backup. Values that hold secrets are masked.

        The preview is available under the same rule as `POST /deployment-center/{tenant}/installations/{installationId}/rollbacks`: only the latest successful run of a push or local installation can be rolled back. Otherwise the request is rejected with `409 NOT_ROLLBACKABLE`. The `errorCode` is always `NOT_ROLLBACKABLE` and the `message` names the reason, in the form `Installation {id} cannot be rolled back: {reason}`. The reasons are: the installation has no run yet; the installation was created by a release, which only offers versions to the target without changing its configuration; the run is not the latest run of the installation; the latest run did not succeed; the latest run was itself a rollback, which cannot be rolled back again; the latest run changed nothing, so there is nothing to restore; the backup is no longer available; or the target workflow step was deleted. While a push, release or rollback job is queued or running for the installation, the request is rejected with `409 ACTIVE_JOB_EXISTS` and `activeJobId`.

        The operator tenant's own catalog entry is registered from the developer portal on first use; if that is not possible the request fails with `409 SELF_TENANT_UNAVAILABLE`.
      tags:
        - Deployment
      security:
        - OAuth2:
            - deploymentcenter.deployment_read
      parameters:
        - name: itemIds
          in: query
          required: false
          schema:
            type: string
          description: 'Comma-separated ids of the items to preview, each in the form `{area}/{itemId}`, for example `schemas/product-extra,agents/loyalty-agent`. Absent previews every item of the installation.'
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request was successful. A list of rollback preview items is returned.
          headers:
            X-Total-Count:
              description: 'Total number of results. Returned when the request sets the `X-Total-Count` header parameter.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RollbackPreviewItem'
              examples:
                List of rollback preview items:
                  value:
                    - id: schemas/product-extra
                      area: schemas
                      name: Product extra
                      action: update
                      current:
                        id: product-extra
                        name:
                          en: Product extra
                        attributes:
                          - key: loyaltyPoints
                            type: INTEGER
                      restored:
                        id: product-extra
                        name:
                          en: Product extra
                        attributes: []
                    - id: agents/loyalty-agent
                      area: agents
                      name: Loyalty agent
                      action: delete
                      current:
                        id: loyalty-agent
                        name: Loyalty agent
                      restored: null
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '409':
          description: 'The request conflicts with the current state. The `errorCode` field tells which rule was hit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              examples:
                Installation created by a release:
                  value:
                    code: 409
                    status: Conflict
                    message: 'Installation czo2NTYzYzNiMmMzZDRlNWY2MDcxODI5MzI6c3RhZ2U cannot be rolled back: A release only offers versions to the target and cannot be rolled back.'
                    errorCode: NOT_ROLLBACKABLE
                Latest run was a rollback:
                  value:
                    code: 409
                    status: Conflict
                    message: 'Installation czo2NTYzYzNiMmMzZDRlNWY2MDcxODI5MzI6c3RhZ2U cannot be rolled back: The latest run was a rollback, which cannot be rolled back again.'
                    errorCode: NOT_ROLLBACKABLE
                Latest run changed nothing:
                  value:
                    code: 409
                    status: Conflict
                    message: 'Installation czo2NTYzYzNiMmMzZDRlNWY2MDcxODI5MzI6c3RhZ2U cannot be rolled back: The latest run changed nothing, so there is nothing to roll back.'
                    errorCode: NOT_ROLLBACKABLE
                Installation has no run yet:
                  value:
                    code: 409
                    status: Conflict
                    message: 'Installation czo2NTYzYzNiMmMzZDRlNWY2MDcxODI5MzI6c3RhZ2U cannot be rolled back: The installation has no run to roll back.'
                    errorCode: NOT_ROLLBACKABLE
                ACTIVE_JOB_EXISTS:
                  value:
                    code: 409
                    status: Conflict
                    message: A rollback on step prod-eu is already queued or running for this package. Follow it instead of starting a new one.
                    errorCode: ACTIVE_JOB_EXISTS
                    activeJobId: '6563e5d0c3d4e5f607182938'
                SELF_TENANT_UNAVAILABLE:
                  value:
                    code: 409
