        area: schemas
        itemId: product-extra
        previous:
          id: product-extra
          name:
            en: Product extra
        current:
          id: product-extra
          name:
            en: Product extra
          description:
            en: Extra attributes of a product
    BuildVersionRequest:
      description: Request to build the next version of a package.
      type: object
