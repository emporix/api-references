openapi: 3.0.0
info:
  title: Deployment Center Service
  version: ''
  description: |-
    The Emporix Deployment Center Service synchronizes configuration between tenants. It bundles custom entities, agents, cloud functions, hostings, indexes and value streams into versioned packages, and delivers a version to the steps of a workflow by push or by release.

    Long-running work, such as building a version, previewing, pushing, releasing, rolling back and installing locally, runs as a job. Starting it answers `202` with a `Location` header, and you follow its progress through the job endpoints.
  contact:
    name: Emporix
    url: 'https://www.emporix.com/contact-us'
servers:
  - url: 'https://api.emporix.io'
security:
  - OAuth2: []
tags:
  - name: Tenant
    description: Manage the catalog of target tenants and test their connections.
  - name: Workflow
    description: Manage workflows and their step trees.
  - name: Package
    description: Manage packages and compare their source items.
  - name: Version
    description: Build, read and delete package versions.
  - name: Deployment
    description: Preview, push and release versions, and read installations, logs, coverage and the dashboard.
  - name: Job
    description: Follow and cancel long-running jobs.
  - name: Available Package
    description: 'Receiving side of a release: available packages, version upload and local install.'
paths:
  '/deployment-center/{tenant}/tenants':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
    get:
      summary: Listing target tenants
      operationId: GET-deploymentcenter-list-tenants
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves the catalog of target tenants. Credentials are never returned. Each tenant carries `has*` flags that tell which credentials are stored.
      tags:
        - Tenant
      security:
        - OAuth2:
            - deploymentcenter.tenant_read
      parameters:
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_sort'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request was successful. A list of tenants is returned.
          headers:
            X-Total-Count:
              description: 'Total number of results. Returned when the request sets the `X-Total-Count` header parameter.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
              examples:
                List of tenants:
                  value:
                    - id: '6563a1f2c3d4e5f607182930'
                      name: acmestage
                      apiUrl: 'https://api.emporix.io'
                      hasClientId: true
                      hasClientSecret: true
                      hasVsmClientId: false
                      hasVsmClientSecret: false
                      createdAt: '2026-11-01T09:00:00Z'
                      modifiedAt: '2026-11-01T09:00:00Z'
                    - id: '6563a1f2c3d4e5f607182931'
                      name: acmeprod
                      apiUrl: 'https://api.emporix.io'
                      hasClientId: true
                      hasClientSecret: true
                      hasVsmClientId: false
                      hasVsmClientSecret: false
                      createdAt: '2026-11-01T09:05:00Z'
                      modifiedAt: '2026-11-01T09:05:00Z'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
    post:
      summary: Registering a target tenant
      operationId: POST-deploymentcenter-create-tenant
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Adds a target tenant to the catalog. The `name` is the target tenant's id on its environment and must be unique in the catalog, otherwise the request is rejected with `409 DUPLICATE_TENANT`. The credentials are write-only: the service stores them securely and never returns them.
      tags:
        - Tenant
      security:
        - OAuth2:
            - deploymentcenter.tenant_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
            examples:
              Request example:
                value:
                  name: acmestage
                  apiUrl: 'https://api.emporix.io'
                  clientId: '4Tz8nR2yQ6vKp1Xe'
                  clientSecret: Hx7qL2mVn9Rw4tPzK3cJ
      responses:
        '201':
          description: The request was successful. The tenant was created.
          headers:
            Location:
              description: URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              examples:
                Created resource:
                  value:
                    id: '6563a1f2c3d4e5f607182930'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '409':
          description: 'The request conflicts with the current state. The `errorCode` field tells which rule was hit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              examples:
                DUPLICATE_TENANT:
                  value:
                    code: 409
                    status: Conflict
                    message: A tenant with this name already exists.
                    errorCode: DUPLICATE_TENANT
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/deployment-center/{tenant}/tenants/{tenantId}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_tenantId'
    get:
      summary: Retrieving a target tenant
      operationId: GET-deploymentcenter-get-tenant
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves one catalog tenant without credentials. Only the `has*` flags are returned.
      tags:
        - Tenant
      security:
        - OAuth2:
            - deploymentcenter.tenant_read
      responses:
        '200':
          description: The request was successful. The tenant is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                Tenant:
                  value:
                    id: '6563a1f2c3d4e5f607182930'
                    name: acmestage
                    apiUrl: 'https://api.emporix.io'
                    hasClientId: true
                    hasClientSecret: true
                    hasVsmClientId: false
                    hasVsmClientSecret: false
                    createdAt: '2026-11-01T09:00:00Z'
                    modifiedAt: '2026-11-01T09:00:00Z'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
    put:
      summary: Updating a target tenant
      operationId: PUT-deploymentcenter-update-tenant
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Updates a catalog tenant: `name` and `apiUrl` are replaced by the values in the body. Credentials that are absent from the body are kept while the URL stays the same, and `vsm: null` clears the VSM credentials. Changing `apiUrl` requires `clientId` and `clientSecret` again, otherwise the request is rejected with `400`. A stored VSM pair is cleared on a URL change unless `vsm` is sent again, so stored credentials are never sent to a new host.

        The `name` is the target tenant's id on its environment and is unique in the catalog. A name that already belongs to another tenant is rejected with `409 DUPLICATE_TENANT`. Renaming a tenant re-points every catalog step that references it, because steps are live references. The rename is rejected with `409 ACTIVE_JOB_EXISTS` while a queued or running push, release or rollback targets one of those steps.
      tags:
        - Tenant
      security:
        - OAuth2:
            - deploymentcenter.tenant_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
            examples:
              Request example:
                value:
                  name: acmestage
                  apiUrl: 'https://api.emporix.io'
                  clientId: Rk4vT8nQ2wL6pX1z
                  clientSecret: Jm5cY9dE3sH7bV2q
      responses:
        '204':
          description: The request was successful. The tenant was updated.
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '409':
          description: 'The request conflicts with the current state. The `errorCode` field tells which rule was hit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              examples:
                DUPLICATE_TENANT:
                  value:
                    code: 409
                    status: Conflict
                    message: A tenant with this name already exists.
                    errorCode: DUPLICATE_TENANT
                ACTIVE_JOB_EXISTS:
                  value:
                    code: 409
                    status: Conflict
                    message: A push is running on step prod, which references this tenant. Wait for it to finish or cancel it, then rename the tenant.
                    errorCode: ACTIVE_JOB_EXISTS
                    activeJobId: '6563e5d0c3d4e5f607182936'
        '500':
          $ref: '#/components/responses/500_resp_common'
    delete:
      summary: Deleting a target tenant
      operationId: DELETE-deploymentcenter-delete-tenant
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Deletes a tenant from the catalog. A tenant that workflow steps still reference is rejected with `409 RESOURCE_IN_USE`.
      tags:
        - Tenant
      security:
        - OAuth2:
            - deploymentcenter.tenant_manage
      responses:
        '204':
          description: The request was successful. The tenant was deleted.
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '409':
          description: 'The request conflicts with the current state. The `errorCode` field tells which rule was hit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              examples:
                RESOURCE_IN_USE:
                  value:
                    code: 409
                    status: Conflict
                    message: The tenant is referenced by workflow step stage.
                    errorCode: RESOURCE_IN_USE
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/deployment-center/{tenant}/tenant-connection-checks':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
    post:
      summary: Checking a connection to a target tenant
      operationId: POST-deploymentcenter-check-tenant-connection
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Tests whether the service can obtain a token from a target environment, either with the stored credentials of a catalog tenant or with candidate credentials that are not saved yet. The check is synchronous and takes at most 8 seconds. Only https `*.emporix.io` hosts are allowed. The result lists the scopes the target client lacks, for example the scope needed to release packages, and never contains an access token.
      tags:
        - Tenant
      security:
        - OAuth2:
            - deploymentcenter.tenant_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCheckRequest'
            examples:
              Request example:
                value:
                  kind: stored
                  tenantId: '6563a1f2c3d4e5f607182931'
      responses:
        '200':
          description: 'The request was successful. Result of the check. A failed check is still a 200 with `ok: false`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionCheckResult'
              examples:
                Connection check result:
                  value:
                    ok: true
                    missingScopes:
                      - deploymentcenter.package_manage
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/deployment-center/{tenant}/workflows':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
    get:
      summary: Listing workflows
      operationId: GET-deploymentcenter-list-workflows
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves the workflows of the operator tenant.
      tags:
        - Workflow
      security:
        - OAuth2:
            - deploymentcenter.workflow_read
      parameters:
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_sort'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request was successful. A list of workflows is returned.
          headers:
            X-Total-Count:
              description: 'Total number of results. Returned when the request sets the `X-Total-Count` header parameter.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
              examples:
                List of workflows:
                  value:
                    - id: '6563b2a1c3d4e5f607182931'
                      name: Dev to production
                      description: Promotes configuration from dev through stage to the production tenants.
                      createdAt: '2026-11-01T09:00:00Z'
                      modifiedAt: '2026-11-12T14:30:00Z'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
    post:
      summary: Creating a workflow
      operationId: POST-deploymentcenter-create-workflow
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Creates an empty workflow. Add its steps with the step tree endpoint.
      tags:
        - Workflow
      security:
        - OAuth2:
            - deploymentcenter.workflow_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowWrite'
            examples:
              Request example:
                value:
                  name: Dev to production
                  description: Promotes configuration from dev through stage to the production tenants.
      responses:
        '201':
          description: The request was successful. The workflow was created.
          headers:
            Location:
              description: URL of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              examples:
                Created resource:
                  value:
                    id: '6563b2a1c3d4e5f607182931'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/deployment-center/{tenant}/workflows/{workflowId}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_workflowId'
    get:
      summary: Retrieving a workflow
      operationId: GET-deploymentcenter-get-workflow
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves one workflow.
      tags:
        - Workflow
      security:
        - OAuth2:
            - deploymentcenter.workflow_read
      responses:
        '200':
          description: The request was successful. The workflow is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
              examples:
                Workflow:
                  value:
                    id: '6563b2a1c3d4e5f607182931'
                    name: Dev to production
                    description: Promotes configuration from dev through stage to the production tenants.
                    createdAt: '2026-11-01T09:00:00Z'
                    modifiedAt: '2026-11-12T14:30:00Z'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
    put:
      summary: Updating a workflow
      operationId: PUT-deploymentcenter-update-workflow
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Replaces the name and description of a workflow. The steps are not changed.
      tags:
        - Workflow
      security:
        - OAuth2:
            - deploymentcenter.workflow_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowWrite'
            examples:
              Request example:
                value:
                  name: Dev to production
                  description: Promotes configuration from dev through stage to the production tenants.
      responses:
        '204':
          description: The request was successful. The workflow was updated.
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
    delete:
      summary: Deleting a workflow
      operationId: DELETE-deploymentcenter-delete-workflow
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Deletes a workflow and its steps, children first. Packages that were linked to the workflow lose the link.
      tags:
        - Workflow
      security:
        - OAuth2:
            - deploymentcenter.workflow_manage
      responses:
        '204':
          description: The request was successful. The workflow and its steps were deleted.
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/deployment-center/{tenant}/workflows/{workflowId}/steps':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_workflowId'
    get:
      summary: Listing the steps of a workflow
      operationId: GET-deploymentcenter-list-workflow-steps
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves the whole step tree of a workflow as a flat list. `parentId` links each step to its parent, and the root has `parentId: null`. Target credentials are never returned.
      tags:
        - Workflow
      security:
        - OAuth2:
            - deploymentcenter.workflow_read
      parameters:
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_sort'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request was successful. The steps of the workflow are returned.
          headers:
            X-Total-Count:
              description: 'Total number of results. Returned when the request sets the `X-Total-Count` header parameter.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowStep'
              examples:
                List of workflow steps:
                  value:
                    - id: dev
                      workflowId: '6563b2a1c3d4e5f607182931'
                      parentId: null
                      target:
                        kind: self
                        targetTenant: acmedev
                    - id: stage
                      workflowId: '6563b2a1c3d4e5f607182931'
                      parentId: dev
                      target:
                        kind: catalog
                        tenantId: '6563a1f2c3d4e5f607182930'
                        targetTenant: acmestage
                        apiUrl: 'https://api.emporix.io'
                        hasClientId: true
                        hasClientSecret: true
                        hasVsmClientId: false
                        hasVsmClientSecret: false
                    - id: prod
                      workflowId: '6563b2a1c3d4e5f607182931'
                      parentId: stage
                      target:
                        kind: catalog
                        tenantId: '6563a1f2c3d4e5f607182931'
                        targetTenant: acmeprod
                        apiUrl: 'https://api.emporix.io'
                        hasClientId: true
                        hasClientSecret: true
                        hasVsmClientId: false
                        hasVsmClientSecret: false
                    - id: prod-eu
                      workflowId: '6563b2a1c3d4e5f607182931'
                      parentId: prod
                      target:
                        kind: inline
                        targetTenant: acmeprodeu
                        apiUrl: 'https://api.emporix.io'
                        hasClientId: true
                        hasClientSecret: true
                        hasVsmClientId: true
                        hasVsmClientSecret: true
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '500':
          $ref: '#/components/responses/500_resp_common'
    put:
      summary: Replacing the step tree of a workflow
      operationId: PUT-deploymentcenter-replace-workflow-steps
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Replaces the whole step tree in one atomic call, which covers creating, updating and deleting steps. The tree must have exactly one root, be acyclic and have unique ids, otherwise the request is rejected with `400`. Credentials that are absent on an existing inline step are kept, unless its `apiUrl` changes. In that case `clientId` and `clientSecret` must be sent again, otherwise the request is rejected with `400`, and a stored VSM pair is cleared unless `vsm` is sent again, so stored credentials are never sent to a new host.
      tags:
        - Workflow
      security:
        - OAuth2:
            - deploymentcenter.workflow_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStepsWrite'
