components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: 'https://api.emporix.io/oauth/token'
          scopes:
            deploymentcenter.tenant_read: Needed to read the catalog of target tenants.
            deploymentcenter.tenant_manage: Needed to manage target tenants and test their connections.
            deploymentcenter.workflow_read: Needed to read workflows and their steps.
            deploymentcenter.workflow_manage: Needed to manage workflows and their steps.
            deploymentcenter.package_read: Needed to read packages, versions, source items and available packages.
            deploymentcenter.package_manage: Needed to manage packages and versions, and to receive released packages.
            deploymentcenter.deployment_read: Needed to read installations, logs, coverage, the dashboard and jobs.
            deploymentcenter.deployment_manage: Needed to start previews, pushes, releases, rollbacks and local installs, and to cancel jobs.
  schemas:
    ErrorMessage:
      description: Standard Emporix error body.
      type: object
      properties:
        code:
          description: HTTP status code.
          type: integer
        status:
          description: HTTP status text.
          type: string
        type:
          description: Error type identifier.
          type: string
        message:
          description: Human-readable error message.
          type: string
        resourceId:
          description: Id of the resource the error refers to, when there is one.
          type: string
        moreInfo:
          description: Link to additional error documentation.
          type: string
        details:
          description: Field-level validation details.
          type: array
          items:
            type: object
            properties:
              field:
                description: Name of the field that failed validation.
                type: string
              type:
                description: Type of the validation problem.
                type: string
              message:
                description: Human-readable description of the validation problem.
                type: string
              moreInfo:
                description: Link to additional documentation about the problem.
                type: string
    ErrorMessageFault:
      description: Error body of the API gateway for authorization failures.
      type: object
      properties:
        fault:
          description: Details of the gateway fault.
          type: object
          properties:
            faultstring:
              description: Human-readable fault message.
              type: string
            detail:
              description: Machine-readable fault details.
              type: object
              properties:
                errorcode:
                  description: Machine-readable fault code.
                  type: string
    NullValue:
      description: 'JSON `null`. A field that refers to this schema can be `null`.'
      type: object
      nullable: true
      enum:
        - null
    JobError:
      description: 'Why a job failed. It is an ErrorMessage plus a machine-readable `errorCode`.'
      allOf:
        - $ref: '#/components/schemas/ErrorMessage'
        - type: object
          required:
            - errorCode
          properties:
            errorCode:
              description: 'Machine-readable reason. `JOB_ABANDONED`: the job stopped making progress and was ended as failed; its target can be used by a new job. `ITEM_FAILURES`: the job ran to the end but one or more items failed; the per-item results name them. `ROLLBACK_STALE`: the target changed since the run that is being rolled back, so the backup no longer matches it. `STEP_CHANGED`: the target workflow step was edited after the job was started. `STEP_GONE`: the target workflow step was deleted after the job was started. `JOB_FAILED`: generic failure; the `message` tells more. `BACKUP_FAILED`: the backup of the target taken before the run could not be written. `BACKUP_READ_FAILED`: the stored backup could not be read for a rollback. `BACKUP_TARGET_MISMATCH`: the backup does not belong to the target of the rollback. `RELEASE_FAILED`: the target environment refused or could not be reached for the available-package upsert of a release. `ITEM_UNREADABLE`, `SCHEMA_READ_FAILED`, `AGENT_EXPORT_FAILED`, `PACKAGE_READ_FAILED`: an item, schema, agent export or stored version archive could not be read. `MISSING_FUNCTION_DEPLOYMENT`, `MISSING_HOSTING_DEPLOYMENT`: a cloud function or hosting has no deployment to capture. `VSM_CREDENTIALS_MISSING`, `VSM_REQUEST_FAILED`: value streams need a VSM client pair on the tenant entry, or the value-stream API call failed. `ARCHIVE_ENTRY_TOO_LARGE`, `ARCHIVE_TOO_LARGE`, `ARCHIVE_TOO_MANY_ENTRIES`, `ARCHIVE_PART_TOO_LARGE`: the version archive or backup would exceed the archive limits (one item, all items together, the number of files, or a part above what Media stores); the `message` names the item or the limit, and nothing was stored. Conflict codes (see `ConflictCode`) may also appear as `errorCode` when a job fails on a rule that is checked at run time. Clients must tolerate new values.'
              type: string
              x-extensible-enum:
                - JOB_ABANDONED
                - ITEM_FAILURES
                - ROLLBACK_STALE
                - STEP_CHANGED
                - STEP_GONE
                - JOB_FAILED
                - BACKUP_FAILED
                - BACKUP_READ_FAILED
                - BACKUP_TARGET_MISMATCH
                - RELEASE_FAILED
                - ITEM_UNREADABLE
                - MISSING_FUNCTION_DEPLOYMENT
                - MISSING_HOSTING_DEPLOYMENT
                - VSM_REQUEST_FAILED
                - VSM_CREDENTIALS_MISSING
                - SCHEMA_READ_FAILED
                - AGENT_EXPORT_FAILED
                - PACKAGE_READ_FAILED
                - ARCHIVE_ENTRY_TOO_LARGE
                - ARCHIVE_TOO_LARGE
                - ARCHIVE_TOO_MANY_ENTRIES
                - ARCHIVE_PART_TOO_LARGE
    ConflictCode:
      description: 'Machine-readable reason of a 409 response. `SELF_TENANT_UNAVAILABLE`: the operator tenant''s own catalog entry is missing and could not be created from the developer portal; register the tenant on the Tenants page.'
      type: string
      enum:
        - ACTIVE_JOB_EXISTS
        - PROMOTION_BLOCKED
        - ACKNOWLEDGEMENT_REQUIRED
        - VERSION_CONFLICT
        - VERSION_NOT_PACKAGED
        - VERSION_NOT_DELETABLE
        - VERSION_IMMUTABLE
        - NOT_ROLLBACKABLE
        - JOB_NOT_CANCELLABLE
        - DUPLICATE_TENANT
        - RESOURCE_IN_USE
        - IDEMPOTENCY_KEY_REUSED
        - SELF_TENANT_UNAVAILABLE
    ConflictError:
      description: 'A 409 response. It is an ErrorMessage plus the machine-readable `errorCode` and the ids the client needs to resolve the conflict.'
      allOf:
        - $ref: '#/components/schemas/ErrorMessage'
        - type: object
          required:
            - errorCode
          properties:
            errorCode:
              $ref: '#/components/schemas/ConflictCode'
              description: Machine-readable reason of the conflict.
            activeJobId:
              description: 'Id of the queued or running job that blocks the request. For a push, release, or rollback of a push installation it is a push, release or rollback of the same package on the same target step. For a local install or a rollback of a local installation it is a local install or rollback of the same available package. For a build it is the package''s build. For delete-package it is a build, push, release or rollback of the package (previews do not block). For an update-tenant rename it is a push, release or rollback targeting a step that references the tenant. Set with `ACTIVE_JOB_EXISTS`; follow this job instead of starting a new one.'
              type: string
            blockedByStepId:
              description: 'Id of the parent workflow step whose installed or released version is lower than the requested one. Set with `PROMOTION_BLOCKED`.'
              type: string
            missingVersion:
              description: 'Requested version number that the parent step has not reached yet. Set with `PROMOTION_BLOCKED`.'
              type: integer
            itemIds:
              description: 'Ids of the items that must be acknowledged, each in the form `{area}/{itemId}`, for example `schemas/product-extra`. Set with `ACKNOWLEDGEMENT_REQUIRED`.'
              type: array
              items:
                type: string
                pattern: '^(schemas|instances|indexes|agents|cloud-functions|hostings|vsm)/.+$'
    IdResponse:
      description: Identifier of a resource that was created.
      type: object
      required:
        - id
      properties:
        id:
          description: Id of the created resource.
          type: string
      example:
        id: '6563a1f2c3d4e5f607182930'
    VsmCredentials:
      description: VSM client credentials. The pair is always sent together. Request only.
      type: object
      required:
        - clientId
        - clientSecret
      properties:
        clientId:
          description: Client id of the VSM client.
          type: string
        clientSecret:
          description: Client secret of the VSM client. Write-only.
          type: string
          format: password
    TenantCreate:
      description: Request body to register a target tenant. Credentials are write-only.
      type: object
      required:
        - name
        - apiUrl
        - clientId
        - clientSecret
      properties:
        name:
          description: "The target tenant's id on its environment. It is unique in the catalog."
          type: string
        apiUrl:
          description: 'Base URL of the target environment. Must be https and a `*.emporix.io` host.'
          type: string
          format: uri
          pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
        clientId:
          description: Client id of the API client used to reach the target.
          type: string
        clientSecret:
          description: 'Client secret of the API client. Write-only: it is stored securely and never returned.'
          type: string
          format: password
        vsm:
          $ref: '#/components/schemas/VsmCredentials'
          description: VSM client credentials of the target tenant. Optional.
    TenantUpdate:
      description: 'Request body to update a tenant. While `apiUrl` stays the same, absent credentials are kept and `vsm: null` clears the VSM pair. `clientId` and `clientSecret` are sent together or not at all, otherwise the request is rejected with `400`. Changing `apiUrl` requires `clientId` and `clientSecret` again, otherwise the request is rejected with `400`. A stored VSM pair is cleared on a URL change unless `vsm` is sent again, so stored credentials are never sent to a new host.'
      type: object
      required:
        - name
        - apiUrl
      properties:
        name:
          description: "The target tenant's id on its environment. It is unique in the catalog. Renaming re-points every catalog step that references this tenant."
          type: string
        apiUrl:
          description: 'Base URL of the target environment. Must be https and a `*.emporix.io` host.'
          type: string
          format: uri
          pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
        clientId:
          description: 'New client id. Absent keeps the stored value while `apiUrl` stays the same; it is required when `apiUrl` changes.'
          type: string
        clientSecret:
          description: 'New client secret. Absent keeps the stored value while `apiUrl` stays the same; it is required when `apiUrl` changes.'
          type: string
          format: password
        vsm:
          description: 'Absent keeps the stored VSM credentials while `apiUrl` stays the same and clears them when `apiUrl` changes. `null` clears them, and an object replaces both values.'
          oneOf:
            - $ref: '#/components/schemas/VsmCredentials'
            - $ref: '#/components/schemas/NullValue'
    CredentialFlags:
      description: Flags that tell which credentials are stored. The values themselves are never returned.
      type: object
      required:
        - hasClientId
        - hasClientSecret
        - hasVsmClientId
        - hasVsmClientSecret
      properties:
        hasClientId:
          description: A client id is stored.
          type: boolean
        hasClientSecret:
          description: A client secret is stored.
          type: boolean
        hasVsmClientId:
          description: A VSM client id is stored.
          type: boolean
        hasVsmClientSecret:
          description: A VSM client secret is stored.
          type: boolean
    Tenant:
      description: 'A target tenant in the catalog. Credentials are write-only; only the `has*` flags are returned.'
      allOf:
        - $ref: '#/components/schemas/CredentialFlags'
        - type: object
          required:
            - id
            - name
            - apiUrl
          properties:
            id:
              description: Unique identifier of the tenant in the catalog, generated when the tenant is registered.
              type: string
            name:
              description: Id of the target tenant on its environment. It is unique in the catalog. Renaming a tenant re-points every catalog step that references it.
              type: string
            apiUrl:
              description: Base URL of the target environment.
              type: string
              format: uri
              pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
            createdAt:
              description: Date and time when the object was created.
              type: string
              format: date-time
            modifiedAt:
              description: Date and time when the object was last modified.
              type: string
              format: date-time
      example:
        id: '6563a1f2c3d4e5f607182930'
        name: acmestage
        apiUrl: 'https://api.emporix.io'
        hasClientId: true
        hasClientSecret: true
        hasVsmClientId: false
        hasVsmClientSecret: false
        createdAt: '2026-11-01T09:00:00Z'
        modifiedAt: '2026-11-01T09:00:00Z'
    ConnectionCheckRequest:
      description: 'What to check. `stored` tests a catalog tenant with its stored credentials; `candidate` tests credentials that are not saved yet.'
      oneOf:
        - $ref: '#/components/schemas/StoredConnectionCheck'
        - $ref: '#/components/schemas/CandidateConnectionCheck'
      discriminator:
        propertyName: kind
        mapping:
          stored: '#/components/schemas/StoredConnectionCheck'
          candidate: '#/components/schemas/CandidateConnectionCheck'
    StoredConnectionCheck:
      description: Checks a catalog tenant with its stored credentials.
      type: object
      required:
        - kind
        - tenantId
      properties:
        kind:
          description: 'Variant selector. Always `stored`.'
          type: string
          enum:
            - stored
        tenantId:
          description: Catalog tenant to test.
          type: string
        apiUrl:
          description: 'Optional URL override. If it differs from the stored URL the check answers `url-changed` instead of sending the stored credentials.'
          type: string
          format: uri
          pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
    CandidateConnectionCheck:
      description: Checks credentials that are not saved yet.
      type: object
      required:
        - kind
        - apiUrl
        - clientId
        - clientSecret
      properties:
        kind:
          description: 'Variant selector. Always `candidate`.'
          type: string
          enum:
            - candidate
        apiUrl:
          description: 'Base URL of the target environment. Must be https and a `*.emporix.io` host.'
          type: string
          format: uri
          pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
        clientId:
          description: Client id of the API client to test.
          type: string
        clientSecret:
          description: Client secret of the API client to test. Write-only.
          type: string
          format: password
    ConnectionCheckResult:
      description: 'Result of a connection check. It never contains an access token. `missingScopes` lists scopes the target client lacks, for example the scope needed to release packages.'
      type: object
      required:
        - ok
      properties:
        ok:
          description: The target accepted the credentials.
          type: boolean
        reason:
          description: 'Why the check failed. Absent when `ok` is true.'
          type: string
          enum:
            - host-not-allowed
            - url-changed
            - no-credentials
            - network
            - rejected
            - missing_token
        detail:
          description: 'Short explanation from the target of why it rejected the credentials. Present only when `reason` is `rejected`.'
          type: string
          maxLength: 200
        missingScopes:
          description: Scopes the target client lacks. Absent when none are missing.
          type: array
          items:
            type: string
      example:
        ok: true
        missingScopes:
          - deploymentcenter.package_manage
    WorkflowWrite:
      description: Request body to create or update a workflow.
      type: object
      required:
        - name
      properties:
        name:
          description: Name of the workflow.
          type: string
        description:
          description: Description of the workflow.
          type: string
          nullable: true
    Workflow:
      description: 'A workflow: a named tree of steps along which versions are pushed or released.'
      type: object
      required:
        - id
        - name
      properties:
        id:
          description: Unique identifier of the workflow, generated when the workflow is created.
          type: string
        name:
          description: Name of the workflow.
          type: string
        description:
          description: Description of the workflow.
          type: string
          nullable: true
        createdAt:
          description: Date and time when the object was created.
          type: string
          format: date-time
        modifiedAt:
          description: Date and time when the object was last modified.
          type: string
          format: date-time
      example:
        id: '6563b2a1c3d4e5f607182931'
        name: Dev to production
        description: Promotes configuration from dev through stage to the production tenants.
        createdAt: '2026-11-01T09:00:00Z'
        modifiedAt: '2026-11-12T14:30:00Z'
    SelfStepTargetWrite:
      description: The step targets the operator tenant itself, so no credentials are stored for it.
      type: object
      required:
        - kind
      properties:
        kind:
          description: 'Variant selector. Always `self`.'
          type: string
          enum:
            - self
    CatalogStepTargetWrite:
      description: The step references a tenant of the catalog.
      type: object
      required:
        - kind
        - tenantId
      properties:
        kind:
          description: 'Variant selector. Always `catalog`.'
          type: string
          enum:
            - catalog
        tenantId:
          description: Catalog tenant to reference. The reference is live, so credentials rotate in one place.
          type: string
    InlineStepTargetWrite:
      description: The step carries its own target, with its own credentials.
      type: object
      required:
        - kind
        - targetTenant
        - apiUrl
      properties:
        kind:
          description: 'Variant selector. Always `inline`.'
          type: string
          enum:
            - inline
        targetTenant:
          description: Tenant id on the target environment.
          type: string
        apiUrl:
          description: 'Base URL of the target environment. Must be https and a `*.emporix.io` host. `clientId` and `clientSecret` are required when the step is new or this URL changes, otherwise the request is rejected with `400`. They are sent together or not at all, and absent on an unchanged existing step keeps the stored pair. A stored VSM pair is cleared on a URL change unless `vsm` is sent again.'
          type: string
          format: uri
          pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
        clientId:
          description: 'Client id of the API client used to reach the target. Required for a new step and when `apiUrl` changes; absent on an unchanged existing step keeps the stored value.'
          type: string
        clientSecret:
          description: 'Client secret of the API client. Write-only. Required for a new step and when `apiUrl` changes; absent on an unchanged existing step keeps the stored value.'
          type: string
          format: password
        vsm:
          description: 'Absent keeps the stored VSM pair on an existing step while `apiUrl` stays the same and clears it when `apiUrl` changes. `null` clears it, and an object replaces both values.'
          oneOf:
            - $ref: '#/components/schemas/VsmCredentials'
            - $ref: '#/components/schemas/NullValue'
    StepTargetWrite:
      description: 'Target of a workflow step in a request. The `kind` field selects the variant.'
      oneOf:
        - $ref: '#/components/schemas/SelfStepTargetWrite'
        - $ref: '#/components/schemas/CatalogStepTargetWrite'
        - $ref: '#/components/schemas/InlineStepTargetWrite'
      discriminator:
        propertyName: kind
        mapping:
          self: '#/components/schemas/SelfStepTargetWrite'
          catalog: '#/components/schemas/CatalogStepTargetWrite'
          inline: '#/components/schemas/InlineStepTargetWrite'
    SelfStepTarget:
      description: The step targets the operator tenant itself.
      type: object
      required:
        - kind
        - targetTenant
      properties:
        kind:
          description: 'Variant selector. Always `self`.'
          type: string
          enum:
            - self
        targetTenant:
          description: The operator tenant.
          type: string
    CatalogStepTarget:
      description: 'The step references a catalog tenant. Credentials are write-only; only the `has*` flags are returned.'
      allOf:
        - $ref: '#/components/schemas/CredentialFlags'
        - type: object
          required:
            - kind
            - tenantId
            - targetTenant
            - apiUrl
          properties:
            kind:
              description: 'Variant selector. Always `catalog`.'
              type: string
              enum:
                - catalog
            tenantId:
              description: Id of the referenced tenant in the catalog.
              type: string
            targetTenant:
              description: 'Id of the target tenant on its environment, taken from the catalog tenant''s name.'
              type: string
            apiUrl:
              description: Base URL of the target environment.
              type: string
              format: uri
              pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
    InlineStepTarget:
      description: 'The step carries its own target. Credentials are write-only; only the `has*` flags are returned.'
      allOf:
        - $ref: '#/components/schemas/CredentialFlags'
        - type: object
          required:
            - kind
            - targetTenant
            - apiUrl
          properties:
            kind:
              description: 'Variant selector. Always `inline`.'
              type: string
              enum:
                - inline
            targetTenant:
              description: Tenant id on the target environment.
              type: string
            apiUrl:
              description: Base URL of the target environment.
              type: string
              format: uri
              pattern: '^https://([a-z0-9-]+\.)*emporix\.io(/.*)?$'
    StepTarget:
      description: 'Target of a workflow step in a response. The `kind` field selects the variant.'
      oneOf:
        - $ref: '#/components/schemas/SelfStepTarget'
        - $ref: '#/components/schemas/CatalogStepTarget'
        - $ref: '#/components/schemas/InlineStepTarget'
      discriminator:
        propertyName: kind
        mapping:
          self: '#/components/schemas/SelfStepTarget'
          catalog: '#/components/schemas/CatalogStepTarget'
          inline: '#/components/schemas/InlineStepTarget'
    WorkflowStepWrite:
      description: A step of a workflow in a step tree request.
      type: object
      required:
        - id
        - parentId
        - target
      properties:
        id:
          description: Id of the step, chosen by the client.
          type: string
        parentId:
          description: 'Parent step id; null for the single root.'
          type: string
          nullable: true
        target:
          $ref: '#/components/schemas/StepTargetWrite'
          description: Where the step delivers versions to.
    WorkflowStepsWrite:
      description: The whole step tree. It must have exactly one root, be acyclic and have unique ids, otherwise the request is rejected with 400.
      type: object
      required:
        - steps
      properties:
        steps:
          description: All steps of the workflow.
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepWrite'
    WorkflowStep:
      description: 'A step of a workflow: one tenant that receives versions, linked to its parent step.'
      type: object
      required:
        - id
        - workflowId
        - parentId
        - target
      properties:
        id:
          description: Id of the step, unique within its workflow.
          type: string
        workflowId:
          description: Id of the workflow the step belongs to.
          type: string
        parentId:
          description: 'Id of the parent step. It is `null` for the root.'
          type: string
          nullable: true
        target:
          $ref: '#/components/schemas/StepTarget'
          description: Where the step delivers versions to.
      example:
        id: stage
        workflowId: '6563b2a1c3d4e5f607182931'
        parentId: dev
        target:
          kind: catalog
          tenantId: '6563a1f2c3d4e5f607182930'
