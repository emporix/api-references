        hash: 'c91e5a07d3f84b26a0e7d15c9b38f4a2e6d70183b5c9a4f1e82d63b07a15c4e9'
        exportError: null
    ItemDiff:
      description: The content of one item in the latest packaged version and on the source tenant.
      type: object
      required:
        - area
        - itemId
      properties:
        area:
          $ref: '#/components/schemas/Area'
          description: Content area of the item.
        itemId:
          description: Id of the item inside its area.
          type: string
        previous:
