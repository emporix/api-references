          type: object
          nullable: true
          additionalProperties: true
          x-masked: true
        current:
          description: Item content on the source tenant now, null when the item was removed. The server masks known secret fields in the returned content.
          type: object
          nullable: true
          additionalProperties: true
          x-masked: true
