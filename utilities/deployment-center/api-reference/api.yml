        - $ref: '#/components/schemas/StepPackageSource'
      discriminator:
        propertyName: kind
        mapping:
          self: '#/components/schemas/SelfPackageSource'
          step: '#/components/schemas/StepPackageSource'
    PackageWrite:
      description: Request body to create or update a package.
      type: object
      required:
        - name
