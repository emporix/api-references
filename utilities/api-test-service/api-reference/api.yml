openapi: 3.0.0
info:
  title: API-Test Service
  contact:
    name: Emporix
    url: 'https://emporix.com'
    email: documentation@emporix.com
  version: ''
  description: |-
    Fake service used for documentation and OpenAPI publishing tests. Do not use in production.
servers:
  - url: 'https://api.emporix.io'
tags:
  - name: Items
  - name: Health
paths:
  '/api-test/{tenant}/health':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
    get:
      tags:
        - Health
      summary: Checking service health
      description: |-
        Returns the health status of the API-Test Service.
      operationId: GET-api-test-health
      security:
        - OAuth2:
            - apitest.item_view
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
                service: api-test
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
  '/api-test/{tenant}/items':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
    get:
      tags:
        - Items
      summary: Retrieving all items
      description: |-
        Retrieves all items for the tenant. You can filter the results with query parameters.
      operationId: GET-api-test-items
      security:
        - OAuth2:
            - apitest.item_view
      parameters:
        - name: pageNumber
          in: query
          required: false
          description: Page number to retrieve. Starts from `0`.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          required: false
          description: Number of items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
              example:
                - id: item-1001
                  name: Sample item
                  description: An example item for API testing.
                  active: true
                  metadata:
                    createdAt: '2026-03-12T09:15:00.000Z'
                    modifiedAt: '2026-03-12T09:15:00.000Z'
                - id: item-1002
                  name: Another item
                  description: Second example item.
                  active: false
                  metadata:
                    createdAt: '2026-03-13T11:00:00.000Z'
                    modifiedAt: '2026-03-14T08:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
    post:
      tags:
        - Items
      summary: Creating an item
      description: |-
        Creates a new item for the tenant.
      operationId: POST-api-test-items
      security:
        - OAuth2:
            - apitest.item_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
            example:
              name: Sample item
              description: An example item for API testing.
              active: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the created item.
              example:
                id: item-1001
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
  '/api-test/{tenant}/items/{itemId}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_itemId'
    get:
      tags:
        - Items
      summary: Retrieving an item
      description: |-
        Retrieves a specified item.
      operationId: GET-api-test-items-itemId
      security:
        - OAuth2:
            - apitest.item_view
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                id: item-1001
                name: Sample item
                description: An example item for API testing.
                active: true
                metadata:
                  createdAt: '2026-03-12T09:15:00.000Z'
                  modifiedAt: '2026-03-12T09:15:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
    put:
      tags:
        - Items
      summary: Updating an item
      description: |-
        Updates a specified item by replacing all of its existing data with data from the request body.
      operationId: PUT-api-test-items-itemId
      security:
        - OAuth2:
            - apitest.item_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
            example:
              name: Updated sample item
              description: Updated description for API testing.
              active: false
      responses:
        '204':
          description: Item updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
    delete:
      tags:
        - Items
      summary: Deleting an item
      description: |-
        Deletes a specified item.
      operationId: DELETE-api-test-items-itemId
      security:
        - OAuth2:
            - apitest.item_manage
      responses:
        '204':
          description: Item deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
components:
  parameters:
    path_tenant:
      name: tenant
      in: path
      required: true
      description: |-
        The name of your tenant.

        **Note**: The tenant name should always be provided in lowercase.
      schema:
        type: string
        pattern: '[a-zA-Z0-9_-]+'
        minLength: 3
        maxLength: 16
    path_itemId:
      name: itemId
      in: path
      required: true
      description: Unique identifier of the item.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          description: Health status of the service.
          example: UP
        service:
          type: string
          description: Service name.
          example: api-test
    Item:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
          description: Unique identifier of the item.
          example: item-1001
        name:
          type: string
          description: Display name of the item.
          example: Sample item
        description:
          type: string
          description: Optional description of the item.
          example: An example item for API testing.
        active:
          type: boolean
          description: Indicates whether the item is active.
          example: true
        metadata:
          $ref: '#/components/schemas/Metadata'
    ItemCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Display name of the item.
          example: Sample item
        description:
          type: string
          description: Optional description of the item.
          example: An example item for API testing.
        active:
          type: boolean
          description: Indicates whether the item is active. Defaults to `true` when omitted.
          example: true
    ItemUpdate:
      type: object
      required:
        - name
        - active
      properties:
        name:
          type: string
          description: Display name of the item.
          example: Updated sample item
        description:
          type: string
          description: Optional description of the item.
          example: Updated description for API testing.
        active:
          type: boolean
          description: Indicates whether the item is active.
          example: false
    Metadata:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: Date and time when the item was created.
        modifiedAt:
          type: string
          format: date-time
          description: Date and time when the item was last modified.
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        status:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
  responses:
    BadRequest_400:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            status: Bad Request
            message: There is a validation error. Please check the details.
            details:
              - message: 'name: must not be blank'
    Unauthorized_401:
      description: Given request is unauthorized - the authorization token is invalid or has expired.
      content:
        application/json:
          schema:
            type: object
            properties:
              fault:
                type: object
                properties:
                  faultstring:
                    type: string
                  detail:
                    type: object
                    properties:
                      errorcode:
                        type: string
          examples:
            Invalid Access Token:
              value:
                fault:
                  faultstring: Invalid Access Token
                  detail:
                    errorcode: keymanagement.service.invalid_access_token
    Forbidden_403:
      description: Permission denied due to insufficient rights.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 403
            status: Forbidden
            message: You need to choose the required scope to complete this action.
            details:
              - message: 'Required scope(s): apitest.item_manage'
    NotFound_404:
      description: Given resource cannot be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            status: Not Found
            message: Error while getting resource.
            details:
              - message: Resource with id 'item-1001' not found
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: 'https://api.emporix.io/oauth/token'
          scopes:
            apitest.item_view: View API-Test items
            apitest.item_manage: Manage API-Test items
security:
  - OAuth2: []
